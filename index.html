<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f6f4"><title>Мой КБЖУ</title><style>
:root{--g:#5b8f5e;--gl:#eaf3e9;--bg:#f4f7f4;--t:#18201b;--m:#78827b;--l:#dfe6e0;--r:#b95656;--b:#347ff0}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select{font:inherit}button{border:0}body{padding-bottom:env(safe-area-inset-bottom)}.app{max-width:820px;margin:auto;padding-bottom:100px}header{padding:20px 16px 12px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:11px;align-items:center}.logo{width:57px;height:57px;border-radius:18px;background:#e8f1e6;display:grid;place-items:center;font-size:31px}h1{margin:0;font-size:28px}.sub{color:var(--m);font-size:15px}.lang{display:flex;background:#edf1ed;border-radius:20px;padding:4px}.lang button{padding:9px 13px;border-radius:16px;background:transparent;color:var(--b);font-weight:800}.lang button.active{background:#fff}.page{display:none;padding:8px 16px}.page.active{display:block}.card{background:#fff;border:1px solid var(--l);border-radius:26px;padding:21px;margin-bottom:14px;box-shadow:0 8px 28px #18351a0b}.big{font-size:65px;font-weight:800;margin:14px 0 8px}.muted,.today-label{color:var(--m)}.today-label{font-size:20px}.progress{height:15px;background:#e7ece8;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--g)}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{border:2px solid var(--l);border-radius:21px;padding:16px 4px;text-align:center}.metric b{font-size:27px}.metric span{display:block;color:var(--m);margin-top:4px}.planline{margin-top:17px;color:var(--m)}.planline b{color:var(--t)}h2{font-size:24px;margin:0 0 17px}.add{font-size:20px;font-weight:800}.btn{width:100%;padding:17px;border-radius:21px;font-weight:800;font-size:19px;margin-top:10px}.primary{background:var(--g);color:#fff}.soft{background:var(--gl);color:#416d45}.danger{background:#fbeaea;color:var(--r)}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;max-width:820px;margin:auto;background:#fff;border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}.nav button{background:transparent;color:#737d76;padding:8px 2px;border-radius:17px;font-weight:700}.nav button.active{background:var(--gl);color:#416d45}.ico{display:block;font-size:25px}.field{margin-bottom:15px}.field label{display:block;font-weight:750;margin-bottom:7px}.field input,.field select{width:100%;padding:15px;border:2px solid var(--l);border-radius:18px;background:#fff;color:var(--t)}.two,.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.plan-box{background:#f5f7f5;border-radius:20px;padding:18px}.plan-box span{display:block;color:var(--m)}.plan-box b{font-size:26px}.list-item{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--l)}.del{color:var(--r);background:#fbeaea;border-radius:10px;padding:6px 10px}.empty{text-align:center;color:var(--m);padding:15px}.overlay{display:none;position:fixed;inset:0;z-index:50;background:#0007;align-items:flex-end}.overlay.open{display:flex}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:23px 17px calc(23px + env(safe-area-inset-bottom))}.sheet-head{display:flex;justify-content:space-between;align-items:center}.close{width:48px;height:48px;border-radius:50%;background:#edf1ed;color:var(--b);font-size:31px}.result{background:#f6f8f6;border:1px solid var(--l);border-radius:24px;padding:19px;margin-top:15px}.foodname{font-size:24px;font-weight:800}.kcal{font-size:57px;font-weight:800}.kcal small{font-size:18px;color:var(--m)}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.result-grid div{background:#fff;border-radius:18px;padding:14px 3px;text-align:center;font-weight:800;font-size:21px}.result-grid span{display:block;color:var(--m);font-size:14px;font-weight:500;margin-top:4px}.source{white-space:pre-line;color:var(--m);line-height:1.5}.note{margin-top:14px;padding:13px;border-radius:17px;background:#edf7ec;color:#47764b}.warn{background:#fff3e8;color:#9a5a1d}#status{position:fixed;z-index:100;left:50%;bottom:90px;transform:translateX(-50%);background:#202820;color:#fff;padding:12px 17px;border-radius:15px;display:none;max-width:90%;text-align:center}@media(max-width:520px){.two,.plan-grid{grid-template-columns:1fr}.big{font-size:59px}}
</style></head><body><div class="app"><header><div class="brand"><div class="logo">🛍️</div><div><h1>Мой КБЖУ</h1><div class="sub" data-i18n="subtitle"></div></div></div><div class="lang"><button id="ruBtn">RU</button><button id="uaBtn">UA</button></div></header>

<section id="today" class="page active">
<div class="card"><div class="today-label" data-i18n="today"></div><div class="big" id="dayKcal">0</div><div class="muted"><span data-i18n="of"></span> <b id="dayTarget">—</b> <span data-i18n="kcal"></span></div><div class="progress" style="margin-top:22px"><i id="progressBar"></i></div></div>

<div class="card"><div class="grid3">
<div class="metric"><b id="dayP">0 г</b><span data-i18n="protein"></span></div>
<div class="metric"><b id="dayF">0 г</b><span data-i18n="fat"></span></div>
<div class="metric"><b id="dayC">0 г</b><span data-i18n="carbsShort"></span></div>
</div><div class="planline" id="planLine"></div></div>

<div class="card">
<div class="add" data-i18n="addProduct"></div>
<button id="cameraBtn" class="btn primary">📷 <span data-i18n="camera"></span></button>
<button id="galleryBtn" class="btn soft">🖼️ <span data-i18n="gallery"></span></button>
<button id="manualBtn" class="btn soft">✏️ <span data-i18n="manual"></span></button>
<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
<input id="galleryInput" type="file" accept="image/*" hidden>
<button id="clearDay" class="btn danger">🗑️ <span data-i18n="clearDay"></span></button>
</div>

<div class="card"><h2 data-i18n="productsToday"></h2><div id="diaryList"></div></div>
</section>

<section id="profile" class="page">
<div class="card"><h2 data-i18n="profile"></h2>
<div class="two">
<div class="field"><label data-i18n="gender"></label><select id="gender"><option value="male"></option><option value="female"></option></select></div>
<div class="field"><label data-i18n="age"></label><input id="age" type="number"></div>
<div class="field"><label data-i18n="weight"></label><input id="weight" type="number" step=".1"></div>
<div class="field"><label data-i18n="height"></label><input id="height" type="number"></div>
</div>

<div class="field"><label data-i18n="activity"></label><select id="activity">
<option value="1.2"></option><option value="1.375"></option><option value="1.55"></option><option value="1.725"></option><option value="1.9"></option>
</select></div>

<div class="field"><label data-i18n="goal"></label><select id="goal">
<option value="lose"></option><option value="maintain"></option><option value="gain"></option>
</select></div>

<button id="calcBtn" class="btn primary" data-i18n="calcPlan"></button>
</div>

<div class="card"><h2 data-i18n="yourPlan"></h2><div class="plan-grid">
<div class="plan-box"><span data-i18n="calories"></span><b id="planKcal">—</b></div>
<div class="plan-box"><span data-i18n="protein"></span><b id="planP">—</b></div>
<div class="plan-box"><span data-i18n="fat"></span><b id="planF">—</b></div>
<div class="plan-box"><span data-i18n="carbs"></span><b id="planC">—</b></div>
</div></div>
</section>

<section id="weightPage" class="page">
<div class="card"><h2 data-i18n="weightPage"></h2>
<div class="field"><label data-i18n="currentWeight"></label><input id="weight2" type="number" step=".1"></div>
<button id="saveWeight" class="btn primary" data-i18n="save"></button>
</div>
</section>

<section id="planPage" class="page">
<div class="card"><h2 data-i18n="planPage"></h2><div id="planDetails" class="empty"></div></div>
</section>

<nav class="nav">
<button data-page="today"><span class="ico">🏠</span><span data-i18n="today"></span></button>
<button data-page="profile"><span class="ico">👤</span><span data-i18n="profile"></span></button>
<button data-page="weightPage"><span class="ico">⚖️</span><span data-i18n="weightPage"></span></button>
<button data-page="planPage"><span class="ico">🎯</span><span data-i18n="planPage"></span></button>
</nav></div>

<div id="resultModal" class="overlay"><div class="sheet">
<div class="sheet-head"><h2 data-i18n="result"></h2><button class="close" data-close="resultModal">×</button></div>
<div class="result">
<div id="resultName" class="foodname">—</div>
<div class="kcal"><span id="resultKcal">—</span> <small data-i18n="kcal100"></small></div>
<div class="result-grid">
<div id="resultP">—<span data-i18n="protein"></span></div>
<div id="resultF">—<span data-i18n="fat"></span></div>
<div id="resultC">—<span data-i18n="carbs"></span></div>
</div>
<div id="resultSource" class="source"></div>
<div id="resultNote" class="note"></div>
</div>

<div class="field" style="margin-top:18px"><label data-i18n="quantity"></label><input id="resultQty" type="number" value="100" min="1"></div>
<div class="two">
<button id="againBtn" class="btn soft">🔄 <span data-i18n="again"></span></button>
<button id="addResultBtn" class="btn primary">＋ <span data-i18n="add"></span></button>
</div>
</div></div>

<div id="manualModal" class="overlay"><div class="sheet">
<div class="sheet-head"><h2 data-i18n="manualProduct"></h2><button class="close" data-close="manualModal">×</button></div>
<div class="field"><label data-i18n="name"></label><input id="mName"></div>
<div class="two">
<div class="field"><label data-i18n="kcal100"></label><input id="mKcal" type="number"></div>
<div class="field"><label data-i18n="protein100"></label><input id="mP" type="number"></div>
<div class="field"><label data-i18n="fat100"></label><input id="mF" type="number"></div>
<div class="field"><label data-i18n="carbs100"></label><input id="mC" type="number"></div>
</div>
<button id="saveManual" class="btn primary" data-i18n="add"></button>
</div></div>

<div id="busyModal" class="overlay"><div class="sheet" style="text-align:center">
<h2 id="busyTitle"></h2><div id="busyText" class="muted"></div>
<div class="progress" style="margin-top:20px"><i id="ocrProgress" style="width:7%"></i></div>
</div></div>

<div id="status"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
'use strict';

const API='https://my-kbju-api.n8mws69t88.workers.dev';
const STORE='my_kbju_clean_v26';
const today=()=>new Date().toISOString().slice(0,10);
const $=id=>document.getElementById(id);

const T={
ru:{
subtitle:'Питание под твою цель',today:'Сегодня',of:'из',kcal:'ккал',
protein:'Белок',fat:'Жиры',carbs:'Углеводы',carbsShort:'Углев.',
addProduct:'Добавить продукт',camera:'Сфотографировать',gallery:'Из галереи',
manual:'Ввести вручную',clearDay:'Очистить день',productsToday:'Продукты сегодня',
profile:'Профиль',gender:'Пол',age:'Возраст',weight:'Вес, кг',height:'Рост, см',
activity:'Активность',goal:'Цель',calcPlan:'Рассчитать мой план',
yourPlan:'Твой рассчитанный план',calories:'Калории',weightPage:'Вес',
currentWeight:'Текущий вес, кг',save:'Сохранить',planPage:'План',
result:'Результат',quantity:'Количество, г',again:'Распознать ещё раз',
add:'Добавить',manualProduct:'Продукт вручную',name:'Название',
kcal100:'ккал / 100 г',protein100:'Белок / 100 г',fat100:'Жиры / 100 г',
carbs100:'Углеводы / 100 г',noPlan:'Сначала рассчитай профиль',
source:'Этикетка',estimated:'Расчёт по БЖУ',energy:'Энергия',
accepted:'Данные с этикетки приняты.',
partial:'Калорийность найдена, но БЖУ не удалось надёжно прочитать.',
bad:'Не удалось надёжно распознать продукт.',
analyzing:'Анализ фото…',preparing:'Подготавливаю фото',
ocr:'Читаю таблицу пищевой ценности…',checking:'Проверяю числа…',
added:'Продукт добавлен',cleared:'День очищен',
empty:'Пока ничего не добавлено.',fill:'Заполни вес, рост и возраст',
calculated:'План рассчитан',saved:'Вес сохранён',
fallback:'Пробую другой вариант OCR…',unknown:'Распознанный продукт',
manual:'Продукт'
},
ua:{
subtitle:'Харчування відповідно до твоєї мети',today:'Сьогодні',of:'з',kcal:'ккал',
protein:'Білки',fat:'Жири',carbs:'Вуглеводи',carbsShort:'Вуглев.',
addProduct:'Додати продукт',camera:'Сфотографувати',gallery:'З галереї',
manual:'Ввести вручну',clearDay:'Очистити день',productsToday:'Продукти сьогодні',
profile:'Профіль',gender:'Стать',age:'Вік',weight:'Вага, кг',height:'Зріст, см',
activity:'Активність',goal:'Мета',calcPlan:'Розрахувати мій план',
yourPlan:'Твій розрахований план',calories:'Калорії',weightPage:'Вага',
currentWeight:'Поточна вага, кг',save:'Зберегти',planPage:'План',
result:'Результат',quantity:'Кількість, г',again:'Розпізнати ще раз',
add:'Додати',manualProduct:'Продукт вручну',name:'Назва',
kcal100:'ккал / 100 г',protein100:'Білки / 100 г',fat100:'Жири / 100 г',
carbs100:'Вуглеводи / 100 г',noPlan:'Спочатку розрахуй профіль',
source:'Етикетка',estimated:'Розрахунок за БЖВ',energy:'Енергія',
accepted:'Дані з етикетки прийняті.',
partial:'Калорійність знайдено, але БЖВ не вдалося надійно прочитати.',
bad:'Не вдалося надійно розпізнати продукт.',
analyzing:'Аналіз фото…',preparing:'Готую фото',
ocr:'Читаю таблицю харчової цінності…',checking:'Перевіряю числа…',
added:'Продукт додано',cleared:'День очищено',
empty:'Поки нічого не додано.',fill:'Заповни вагу, зріст і вік',
calculated:'План розраховано',saved:'Вагу збережено',
fallback:'Пробую інший варіант OCR…',unknown:'Розпізнаний продукт',
manual:'Продукт'
}};

let s={
lang:'ru',
profile:{gender:'male',age:32,weight:90,height:176,activity:'1.2',goal:'lose'},
plan:null,diary:{},lastFile:null,lastResult:null,worker:null,workerLang:''
};

try{
let x=JSON.parse(localStorage.getItem(STORE)||'null');
if(x)s={...s,...x,profile:{...s.profile,...(x.profile||{})}};
}catch(e){}

const t=k=>(T[s.lang]||T.ru)[k]||T.ru[k]||k;

function save(){
localStorage.setItem(STORE,JSON.stringify({
lang:s.lang,profile:s.profile,plan:s.plan,diary:s.diary
}));
}

function toast(x){
let e=$('status');
e.textContent=x;
e.style.display='block';
clearTimeout(window.tt);
window.tt=setTimeout(()=>e.style.display='none',2700);
}

function modal(id,on=true){
$(id).classList.toggle('open',on);
}

function busy(x,p){
$('busyText').textContent=x;
$('ocrProgress').style.width=p+'%';
}

function lang(){
document.documentElement.lang=s.lang;

document.querySelectorAll('[data-i18n]')
.forEach(e=>e.textContent=t(e.dataset.i18n));

$('ruBtn').classList.toggle('active',s.lang==='ru');
$('uaBtn').classList.toggle('active',s.lang==='ua');

$('gender').options[0].textContent=
s.lang==='ru'?'Мужчина':'Чоловік';

$('gender').options[1].textContent=
s.lang==='ru'?'Женщина':'Жінка';

let a=s.lang==='ru'
?[
'Минимальная — сидячий образ жизни',
'Лёгкая — 1–3 тренировки в неделю',
'Средняя — 3–5 тренировок в неделю',
'Высокая — 6–7 тренировок в неделю',
'Очень высокая — тяжёлая физическая работа'
]
:[
'Мінімальна — сидячий спосіб життя',
'Легка — 1–3 тренування на тиждень',
'Середня — 3–5 тренувань на тиждень',
'Висока — 6–7 тренувань на тиждень',
'Дуже висока — важка фізична робота'
];

[...$('activity').options].forEach((o,i)=>o.textContent=a[i]);

let g=s.lang==='ru'
?['Похудение','Поддержание','Набор веса']
:['Схуднення','Підтримання','Набір ваги'];

[...$('goal').options].forEach((o,i)=>o.textContent=g[i]);

render();
}

function nav(id){
document.querySelectorAll('.page')
.forEach(x=>x.classList.remove('active'));

$(id).classList.add('active');

document.querySelectorAll('.nav button')
.forEach(x=>x.classList.toggle('active',x.dataset.page===id));
}

document.querySelectorAll('.nav button')
.forEach(x=>x.onclick=()=>nav(x.dataset.page));

$('ruBtn').onclick=()=>{
s.lang='ru';save();lang();
};

$('uaBtn').onclick=()=>{
s.lang='ua';save();lang();
};

function profileSync(){
let p=s.profile;
$('gender').value=p.gender;
$('age').value=p.age;
$('weight').value=p.weight;
$('height').value=p.height;
$('activity').value=p.activity;
$('goal').value=p.goal;
$('weight2').value=p.weight;
}

['gender','age','weight','height','activity','goal']
.forEach(id=>$(id).onchange=()=>{
s.profile[id]=$(id).value;
if(['age','weight','height'].includes(id))
s.profile[id]=Number($(id).value);
save();
});

$('calcBtn').onclick=()=>{
let p=s.profile,w=+p.weight,h=+p.height,a=+p.age;

if(!(w&&h&&a)){
toast(t('fill'));
return;
}

let b=p.gender==='male'
?10*w+6.25*h-5*a+5
:10*w+6.25*h-5*a-161;

let k=b*+p.activity;

if(p.goal==='lose')
k-=Math.min(500,k*.2);

if(p.goal==='gain')
k+=250;

k=Math.max(1200,Math.round(k));

let P=Math.round(w*1.6);
let F=Math.round(w*.8);
let C=Math.max(0,Math.round((k-P*4-F*9)/4));

s.plan={kcal:k,protein:P,fat:F,carbs:C};

save();
render();
toast(t('calculated'));
};

$('saveWeight').onclick=()=>{
let w=+$('weight2').value;

if(w>0){
s.profile.weight=w;
save();
render();
toast(t('saved'));
}
};

function esc(x){
return String(x||'').replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m])
);
}

function items(){
return s.diary[today()]||[];
}

function render(){
profileSync();

let a=items();

let z=a.reduce(
(q,x)=>({
k:q.k+x.kcal*x.qty/100,
p:q.p+(x.p||0)*x.qty/100,
f:q.f+(x.f||0)*x.qty/100,
c:q.c+(x.c||0)*x.qty/100
}),
{k:0,p:0,f:0,c:0}
);

$('dayKcal').textContent=Math.round(z.k);
$('dayTarget').textContent=s.plan?s.plan.kcal:'—';
$('dayP').textContent=Math.round(z.p)+' г';
$('dayF').textContent=Math.round(z.f)+' г';
$('dayC').textContent=Math.round(z.c)+' г';

$('progressBar').style.width=
s.plan?Math.min(100,z.k/s.plan.kcal*100)+'%':'0%';

$('planLine').innerHTML=s.plan
?`${t('calories')}: <b>${s.plan.kcal} ккал / Б ${s.plan.protein} / Ж ${s.plan.fat} / ${s.lang==='ru'?'У':'В'} ${s.plan.carbs}</b>`
:t('noPlan');

$('planKcal').textContent=s.plan?s.plan.kcal+' ккал':'—';
$('planP').textContent=s.plan?s.plan.protein+' г':'—';
$('planF').textContent=s.plan?s.plan.fat+' г':'—';
$('planC').textContent=s.plan?s.plan.carbs+' г':'—';

$('planDetails').innerHTML=s.plan
?`<div class="plan-grid">
<div class="plan-box"><span>${t('calories')}</span><b>${s.plan.kcal}</b></div>
<div class="plan-box"><span>${t('protein')}</span><b>${s.plan.protein} г</b></div>
<div class="plan-box"><span>${t('fat')}</span><b>${s.plan.fat} г</b></div>
<div class="plan-box"><span>${t('carbs')}</span><b>${s.plan.carbs} г</b></div>
</div>`
:t('noPlan');

$('diaryList').innerHTML=a.length
?a.map((x,i)=>`
<div class="list-item">
<div>
<b>${esc(x.name)}</b>
<div class="muted">${x.qty} г · ${Math.round(x.kcal*x.qty/100)} ккал</div>
</div>
<button class="del" data-del="${i}">×</button>
</div>`).join('')
:`<div class="empty">${t('empty')}</div>`;

document.querySelectorAll('[data-del]')
.forEach(b=>b.onclick=()=>{
s.diary[today()].splice(+b.dataset.del,1);

/* OCR */

function norm(x){
return String(x||'')
.replace(/\r/g,'\n')
.replace(/[|]/g,' ')
.replace(/[‐-–—]/g,'-')
.replace(/[，]/g,',')
.replace(/\s+/g,' ')
.trim();
}

function num(x){
return Number(
String(x).replace(/\s/g,'').replace(',','.')
);
}

function vk(x){
return Number.isFinite(x)&&x>=0&&x<=1000;
}

function vm(x){
return Number.isFinite(x)&&x>=0&&x<=100;
}

function clean(x){
return String(x||'')
.replace(/[|«»]/g,'')
.replace(/[^\d.,a-zA-ZäöüÄÖÜßа-яА-ЯіІїЇєЄ]/g,'');
}

function linesOf(r){
let w=(r?.data?.words||[])
.filter(x=>String(x.text||'').trim()&&x.bbox);

if(!w.length)return[];

w.sort((a,b)=>
(a.bbox.y0+a.bbox.y1)-
(b.bbox.y0+b.bbox.y1)||
a.bbox.x0-b.bbox.x0
);

let L=[];

for(let x of w){
let y=(x.bbox.y0+x.bbox.y1)/2;
let h=Math.max(8,x.bbox.y1-x.bbox.y0);

let l=L.find(q=>
Math.abs(q.y-y)<=Math.max(14,h*.8,q.h*.8)
);

if(!l){
l={y,h,w:[]};
L.push(l);
}

l.w.push(x);
l.y=(l.y*(l.w.length-1)+y)/l.w.length;
l.h=Math.max(l.h,h);
}

return L.sort((a,b)=>a.y-b.y).map(l=>{
l.w.sort((a,b)=>a.bbox.x0-b.bbox.x0);
l.text=l.w.map(x=>clean(x.text)).join(' ');
return l;
});
}

function fix(raw,ctx){
let x=clean(raw)
.toLowerCase()
.replace(/,/g,'.')
.replace(/[ilo]/g,c=>c==='o'?'0':'1');

if(/^329$/.test(x)&&
/kohlenhydr|carbohydr|углевод|вуглевод/i.test(ctx))
return 32;

if(/^119$/.test(x)&&
/protein|ei.?weiss|ei.?weiß|бел|біл/i.test(ctx))
return 11;

if(/^109$/.test(x)&&
/salz|salt|соль|сіль/i.test(ctx))
return 1;

let m=x.match(
/^(\d{1,4}(?:\.\d+)?)(?:g|gr|kcal|kkal|kj)?$/
);

return m?num(m[1]):null;
}

function nums(l,energy=false){
let a=[];

for(let w of l.w){
let v=fix(w.text,l.text);

if(Number.isFinite(v)&&v>=0&&v<=(energy?4200:100))
a.push({
v,
x:(w.bbox.x0+w.bbox.x1)/2
});
}

return a;
}

function basicEnergy(txt){
let x=norm(txt),k=null,j=null;

let m=/([0-9]{2,5}(?:[.,][0-9]+)?)\s*(?:kJ|кДж)\s*(?:\/|\\|;|,|\s)+\s*([0-9]{2,4}(?:[.,][0-9]+)?)\s*(?:kcal|kkal|ккал)/i.exec(x);

if(m){
j=num(m[1]);
k=num(m[2]);
}

if(k===null){
m=/(?:kcal|kkal|ккал)\s*[:=]?\s*([0-9]{2,4}(?:[.,][0-9]+)?)/i.exec(x);

if(m&&vk(num(m[1])))
k=num(m[1]);
}

if(j===null){
m=/([0-9]{2,5}(?:[.,][0-9]+)?)\s*(?:kJ|кДж)/i.exec(x);

if(m)
j=num(m[1]);
}

if(k===null&&j!==null&&j<=4200)
k=Math.round(j/4.184);

return{
k:vk(k)?k:null,
j
};
}

function per100(L){
let xs=[];

for(let l of L){

if(/(?:pro|je|per).*100|100\s*g|100g/i.test(l.text)){

let w=l.w.find(
x=>/^100$/i.test(clean(x.text))
);

if(w)
xs.push((w.bbox.x0+w.bbox.x1)/2);
}
}

if(xs.length)
return xs.sort((a,b)=>a-b)[Math.floor(xs.length/2)];

for(let l of L)
if(/energie|energy|brennwert|kcal|kj/i.test(l.text)){

let n=nums(l,true);

if(n.length)
xs.push(Math.min(...n.map(x=>x.x)));
}

return xs.length
?xs.sort((a,b)=>a-b)[Math.floor(xs.length/2)]
:null;
}

function pick(a,x,h){

if(!a.length)return null;

if(x===null)return a[0];

a=a.slice().sort(
(u,v)=>Math.abs(u.x-x)-Math.abs(v.x-x)
);

return Math.abs(a[0].x-x)<=Math.max(90,h*5)
?a[0]
:null;
}

function findName(L){

let bad=/(brennwert|nährwert|nutrition|fett|fat|kohlenhydr|carbohydr|ei.?weiß|protein|energie|energy|kcal|kj|zucker|sugar|salz|salt|portion|pro\s*100|davon|gesätt|saturated)/i;

for(let l of L){

let x=norm(l.text);

if(
x.length>=3&&
x.length<70&&
!bad.test(x)&&
!/^[\d\s.,%/:-]+$/.test(x)
)
return x;
}

return t('unknown');
}

function parseBasic(txt){

let L=norm(txt).split(/\n+/).filter(Boolean);
let e=basicEnergy(txt);
let o={p:null,f:null,c:null};

let D=[
['f',/\b(?:fett\w*|fat)\b/i,/(gesätt|saturated)/i],
['c',/\b(?:kohlenhydr\w*|carbohydr\w*|углевод\w*|вуглевод\w*)\b/i,/(zucker|sugar|цукор)/i],
['p',/\b(?:ei.?weiß\w*|ei.?weiss\w*|protein\w*|бел[оа]к\w*|біл[оа]к\w*)\b/i,null]
];

for(let line of L)
for(let d of D)

if(
d[1].test(line)&&
!(d[2]&&d[2].test(line))
){

let m=line
.slice(line.search(d[1]))
.match(/(\d{1,3}(?:[.,]\d+)?)/);

if(
m&&
vm(num(m[1]))&&
o[d[0]]===null
)
o[d[0]]=num(m[1]);
}

let k=e.k;
let est=false;

if(
k===null&&
[o.p,o.f,o.c].every(vm)
){

k=Math.round(
o.p*4+
o.f*9+
o.c*4
);

est=true;
}

return{
name:findName(
L.map(x=>({text:x,w:[]}))
),
kcal:k,
kj:e.j,
p:o.p,
f:o.f,
c:o.c,
estimated:est,
raw:txt
};
}

/* Table-aware parser */

function parse(r){

let text=r?.data?.text||'';
let base=parseBasic(text);
let L=linesOf(r);
let x=per100(L);

if(!L.length)
return base;

let E=[];

for(let l of L)
if(/energie|energy|brennwert|kcal|kj|ккал|кдж/i.test(l.text)){

let n=nums(l,true);

if(n.length)
E.push({l,n});
}

let K=null,J=null;

for(let q of E){

let low=q.l.text.toLowerCase();

let a=q.n.filter(n=>n.v<=1000);
let b=q.n.filter(n=>n.v>1000&&n.v<=4200);

let u=pick(a,x,q.l.h);
let v=pick(b,x,q.l.h);

if(/kcal|kkal|ккал/.test(low)&&u)
K=u.v;

if(/kj|кдж/.test(low)&&v)
J=v.v;
}

if(K===null)
K=base.kcal;

if(J===null)
J=base.kj;

if(vk(K))
base.kcal=K;

if(J>0&&J<=4200)
base.kj=J;

let D=[
['f',/\b(?:fett\w*|fat)\b/i,/(gesätt|saturated|насич)/i],
['c',/\b(?:kohlenhydr\w*|carbohydr\w*|углевод\w*|вуглевод\w*)\b/i,/(zucker|sugar|цукор)/i],
['p',/\b(?:ei.?weiß\w*|ei.?weiss\w*|protein\w*|бел[оа]к\w*|біл[оа]к\w*)\b/i,null]
];

for(let d of D){

let i=L.findIndex(l=>
d[1].test(l.text)&&
!(d[2]&&d[2].test(l.text))
);

if(i<0)
continue;

let n=pick(
nums(L[i]),
x,
L[i].h
);

if(n)
base[d[0]]=n.v;

if(!vm(base[d[0]])){

let c=[];

for(
let j=Math.max(0,i-2);
j<=Math.min(L.length-1,i+2);
j++
)
if(j!==i)
c.push(...nums(L[j]));

n=pick(c,x,L[i].h);

if(n)
base[d[0]]=n.v;
}
}

if(
base.kcal===null&&
[base.p,base.f,base.c].every(vm)
){

base.kcal=Math.round(
base.p*4+
base.f*9+
base.c*4
);

base.estimated=true;

}else{

base.estimated=false;
}

base.name=findName(L);

return base;
}

/* Tesseract */

async function worker(){

if(!s.worker)
s.worker=await Tesseract.createWorker(['deu','eng']);

await s.worker.setParameters({
preserve_interword_spaces:'1'
});

return s.worker;
}

function imgLoad(f){

return new Promise((ok,no)=>{

let i=new Image;

i.onload=()=>{
URL.revokeObjectURL(i.src);
ok(i);
};

i.onerror=no;

i.src=URL.createObjectURL(f);
});
}

function variants(i){

let max=2400;

let sc=Math.min(
1.8,
max/Math.max(i.naturalWidth,i.naturalHeight)
);

let w=Math.round(i.naturalWidth*sc);
let h=Math.round(i.naturalHeight*sc);

let A=[];

for(let deg of [0,90,180,270]){

let c=document.createElement('canvas');

let W=deg%180?h:w;
let H=deg%180?w:h;

c.width=W;
c.height=H;

let q=c.getContext('2d');

q.fillStyle='#fff';
q.fillRect(0,0,W,H);

q.translate(W/2,H/2);
q.rotate(deg*Math.PI/180);

q.drawImage(i,-w/2,-h/2,w,h);

A.push(
c.toDataURL('image/jpeg',.9)
);
}

return A;
}

function score(txt,p){

let z=String(txt).toLowerCase();
let n=0;

if(/kcal|ккал/.test(z))n+=5;
if(/kj|кдж/.test(z))n+=3;
if(/fett|fat|жир/.test(z))n+=3;
if(/kohlenhydr|carbohydr|углевод/.test(z))n+=3;
if(/protein|ei.?weiß|бел|біл/.test(z))n+=3;

if(vk(p.kcal))n+=6;
if(vm(p.p))n+=4;
if(vm(p.f))n+=4;
if(vm(p.c))n+=4;

return n;
}

async function ocr(f){

let i=await imgLoad(f);
let A=variants(i);
let w=await worker();
let best=null;

for(let n=0;n<4;n++){

await w.setParameters({
tessedit_pageseg_mode:n%2?'11':'6',
preserve_interword_spaces:'1'
});

busy(
`${t('ocr')} ${n+1}/4`,
15+n*18
);

let r=await w.recognize(A[n]);
let p=parse(r);
let sc=score(r.data.text,p);

if(!best||sc>best.sc)
best={sc,p,text:r.data.text};
}

if(best.sc<20){

busy(t('fallback'),80);

let r=await w.recognize(A[0]);
let p=parse(r);

if(score(r.data.text,p)>best.sc)
best={
sc:score(r.data.text,p),
p,
text:r.data.text
};
}

return best;
}

/* Secondary API */

async function api(text){

try{

let c=new AbortController();

let tm=setTimeout(
()=>c.abort(),
8000
);

let r=await fetch(
API,
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({
text,
language:'ru,uk,de,en',
task:'nutrition'
}),
signal:c.signal
}
);

clearTimeout(tm);

if(!r.ok)
return null;

let d=(await r.json()).result||{};

return{
kcal:vk(+d.kcal)?+d.kcal:null,
p:vm(+d.protein)?+d.protein:null,
f:vm(+d.fat)?+d.fat:null,
c:vm(+d.carbs)?+d.carbs:null,
name:d.name||''
};

}catch(e){
return null;
}
}

async function process(f){

s.lastFile=f;

modal('busyModal');

$('busyTitle').textContent=t('analyzing');

busy(t('preparing'),7);

try{

let b=await ocr(f);
let r=b.p;

if(
!(
vk(r.kcal)&&
vm(r.p)&&
vm(r.f)&&
vm(r.c)
)
){

let a=await api(b.text);

if(a){

if(!vk(r.kcal))
r.kcal=a.kcal;

if(!vm(r.p))
r.p=a.p;

if(!vm(r.f))
r.f=a.f;

if(!vm(r.c))
r.c=a.c;

if(r.name===t('unknown'))
r.name=a.name||r.name;
}
}

modal('busyModal',false);

if(!r.kcal&&!r.p&&!r.f&&!r.c){

toast(t('bad'));
return;
}

s.lastResult=r;

show(r);

}catch(e){

console.error(e);

modal('busyModal',false);

toast(t('bad'));
}
}

function show(r){

$('resultName').textContent=
r.name||t('unknown');

$('resultKcal').textContent=
r.kcal!=null
?Math.round(r.kcal)
:'—';

$('resultP').firstChild.textContent=
r.p!=null?r.p+' г':'—';

$('resultF').firstChild.textContent=
r.f!=null?r.f+' г':'—';

$('resultC').firstChild.textContent=
r.c!=null?r.c+' г':'—';

$('resultSource').textContent=
`${t('source')}: ${
r.estimated?t('estimated'):t('source')
}${
r.kj
?`\n${t('energy')}: ${r.kj} kJ`
:''
}`;

let ok=
vk(r.kcal)&&
vm(r.p)&&
vm(r.f)&&
vm(r.c);

$('resultNote').textContent=
r.estimated
?t('estimated')
:ok
?t('accepted')
:t('partial');

$('resultNote').className=
'note'+
(ok&&!r.estimated?'':' warn');

$('resultQty').value=100;

modal('resultModal');
}

$('againBtn').onclick=()=>{
modal('resultModal',false);

if(s.lastFile)
process(s.lastFile);
};

$('addResultBtn').onclick=()=>{

add({

};

lang();
