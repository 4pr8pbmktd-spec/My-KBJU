<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Мой КБЖУ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6fa;color:#17181c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:650px;margin:auto;padding:18px 16px 40px}
h1{margin:4px 0;font-size:28px}
.date{color:#777;margin-bottom:18px}
.card{background:white;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0001}
.kcal{font-size:32px;font-weight:700}
.muted{color:#777;font-size:14px}
.bar{height:9px;background:#e8e9ee;border-radius:20px;margin:12px 0 16px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#17181c}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.macro{background:#f3f4f7;border-radius:14px;padding:11px}
.macro b{display:block;font-size:18px}
button,input{font:inherit}
button{border:0;border-radius:15px;padding:14px;font-weight:600;cursor:pointer}
.primary{background:#17181c;color:white}
.secondary{background:white}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:13px;background:white}
.row{display:flex;gap:9px}
.food{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}
.food:last-child{border:0}
.food b{display:block}
.empty{text-align:center;color:#888;padding:15px}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end;z-index:5}
.sheet{background:white;width:100%;border-radius:24px 24px 0 0;padding:18px 16px 28px}
.sheet h2{margin:0 0 14px}
.status{min-height:22px;color:#666;margin:12px 0}
.result{display:none;background:#f3f4f7;border-radius:15px;padding:14px}
.result b{font-size:18px}
</style>
</head>

<body>
<main>
<h1>Мой КБЖУ</h1>
<div class="date" id="date"></div>

<section class="card">
<div><span class="kcal" id="kcal">0</span> <span class="muted">/ 2000 ккал</span></div>
<div class="bar"><i id="bar"></i></div>
<div class="macros">
<div class="macro"><b id="protein">0 г</b><span class="muted">Белки</span></div>
<div class="macro"><b id="fat">0 г</b><span class="muted">Жиры</span></div>
<div class="macro"><b id="carbs">0 г</b><span class="muted">Углеводы</span></div>
</div>
</section>

<div class="actions">
<button class="primary" id="photoBtn" onclick="document.getElementById('modal').style.display='flex'">
📷 Через фото
</button>
<button class="secondary" onclick="alert('Голосовой ввод добавим следующим этапом.')">🎤 Голос</button>
</div>

<section class="card">
<h2>Сегодня</h2>
<div id="foods"><div class="empty">Пока ничего не добавлено</div></div>
</section>

<section class="card">
<h2>Быстрый ввод</h2>
<div class="row">
<input id="manualName" placeholder="Продукт">
<input id="manualGrams" type="number" placeholder="г">
</div>
<button class="primary" style="width:100%;margin-top:10px" onclick="manual()">Добавить</button>
</section>

<section class="card">
<h2>Мои продукты</h2>
<div id="products"><div class="empty">Сохранённых продуктов пока нет</div></div>
</section>
</main>

<div class="modal" id="modal">
<div class="sheet">
<h2>📷 Фото этикетки</h2>

<input id="photo" type="file" accept="image/*" capture="environment">

<input id="grams" type="number" inputmode="decimal"
placeholder="Сколько граммов?"
style="margin-top:10px">

<button class="primary" style="width:100%;margin-top:10px" id="analyze">
Распознать КБЖУ
</button>

<div class="status" id="status"></div>
<div class="result" id="result"></div>

<button class="secondary" style="width:100%;margin-top:10px"
onclick="closeModal()">Закрыть</button>
</div>
</div>

<script>
const WORKER="https://my-kbju-api.n8mws69t88.workers.dev";
const KEY=new Date().toISOString().slice(0,10); 
const photoBtn=document.getElementById("photoBtn");
const modal=document.getElementById("modal");
const photo=document.getElementById("photo");
const grams=document.getElementById("grams");
const analyze=document.getElementById("analyze");
const status=document.getElementById("status");
const result=document.getElementById("result");

const kcal=document.getElementById("kcal");
const protein=document.getElementById("protein");
const fat=document.getElementById("fat");
const carbs=document.getElementById("carbs");
const bar=document.getElementById("bar");
const foods=document.getElementById("foods");
const products=document.getElementById("products");
const date=document.getElementById("date");


let data=JSON.parse(localStorage.getItem("my_kbju")||'{"days":{},"products":[]}');
if(!data.days[KEY])data.days[KEY]=[];

function save(){
localStorage.setItem("my_kbju",JSON.stringify(data));
}

function esc(x){
return String(x||"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[c]));
}

function totals(){
return data.days[KEY].reduce((a,x)=>({
kcal:a.kcal+(+x.kcal||0),
protein:a.protein+(+x.protein||0),
fat:a.fat+(+x.fat||0),
carbs:a.carbs+(+x.carbs||0)
}),{kcal:0,protein:0,fat:0,carbs:0});
}

function render(){
let t=totals();
kcal.textContent=Math.round(t.kcal);
protein.textContent=t.protein.toFixed(1)+" г";
fat.textContent=t.fat.toFixed(1)+" г";
carbs.textContent=t.carbs.toFixed(1)+" г";
bar.style.width=Math.min(100,t.kcal/2000*100)+"%";

foods.innerHTML=data.days[KEY].length
?data.days[KEY].map(x=>`
<div class="food">
<div><b>${esc(x.name)}</b><span class="muted">${x.grams} г · Б ${x.protein} · Ж ${x.fat} · У ${x.carbs}</span></div>
<strong>${x.kcal} ккал</strong>
</div>`).join("")
:'<div class="empty">Пока ничего не добавлено</div>';

let p=Object.values(data.products);
products.innerHTML=p.length
?p.map(x=>`
<div class="food">
<div><b>${esc(x.name)}</b><span class="muted">
${x.kcal_100g??"—"} ккал · Б ${x.protein_100g??"—"} · Ж ${x.fat_100g??"—"} · У ${x.carbs_100g??"—"} на 100 г
</span></div>
</div>`).join("")
:'<div class="empty">Сохранённых продуктов пока нет</div>';
}

date.textContent=new Date().toLocaleDateString("ru-RU",
{day:"numeric",month:"long",year:"numeric"});

photoBtn.onclick=function(){document.getElementById("modal").style.display="flex";};

function closeModal(){
modal.style.display="none";
status.textContent="";
result.style.display="none";
}

function manual(){
alert("Для точного расчёта сфотографируйте этикетку продукта.");
}

function resize(file){
return new Promise((resolve,reject)=>{
let r=new FileReader();
r.onload=()=>{
let img=new Image();
img.onload=()=>{
let w=img.width,h=img.height,max=1400;
if(Math.max(w,h)>max){
let s=max/Math.max(w,h);
w=Math.round(w*s);h=Math.round(h*s);
}
let c=document.createElement("canvas");
c.width=w;c.height=h;
c.getContext("2d").drawImage(img,0,0,w,h);
resolve(c.toDataURL("image/jpeg",.82));
};
img.onerror=reject;
img.src=r.result;
};
r.onerror=reject;
r.readAsDataURL(file);
});
}

analyze.onclick=async()=>{
let file=photo.files[0];
let g=Number(grams.value);

if(!file){
status.textContent="Сначала сфотографируйте этикетку.";
return;
}

if(!g||g<=0){
status.textContent="Укажите количество граммов.";
return;
}

status.textContent="⏳ Анализирую фото...";
result.style.display="none";

try{
let image=await resize(file);

let response=await fetch("https://my-kbju-api.n8mws69t88.workers.dev",{,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({image:image,grams:g})
});

let answer=await response.json();

if(!response.ok||!answer.ok)
throw new Error(answer.details||answer.error||"Ошибка сервера");

let p=answer.product;
let q=answer.portion;

result.innerHTML=`
<b>${esc(p.name)}</b>
<div style="margin-top:8px">
${q.kcal??"—"} ккал ·
Б ${q.protein??"—"} г ·
Ж ${q.fat??"—"} г ·
У ${q.carbs??"—"} г
</div>
<button class="primary" style="width:100%;margin-top:12px"
id="addResult">Добавить в дневник</button>
`;

result.style.display="block";
status.textContent="✅ Готово";

data.products[p.name]=p;
save();
render();

addResult.onclick=()=>{
data.days[KEY].push({
name:p.name,
grams:q.grams,
kcal:q.kcal,
protein:q.protein,
fat:q.fat,
carbs:q.carbs
});
save();
render();
closeModal();
};

}catch(e){
status.textContent="❌ Ошибка: "+e.message;
}
};

render();
</script>
</body>
</html>
