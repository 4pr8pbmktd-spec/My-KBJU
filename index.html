<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Мой КБЖУ</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f6fa;
  color:#17181c;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

main{
  max-width:650px;
  margin:auto;
  padding:18px 16px 40px;
}

h1{
  margin:4px 0;
  font-size:28px;
}

.date{
  color:#777;
  margin-bottom:18px;
}

.card{
  background:white;
  border-radius:20px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 12px #0001;
}

.kcal{
  font-size:32px;
  font-weight:700;
}

.muted{
  color:#777;
  font-size:14px;
}

.bar{
  height:9px;
  background:#e8e9ee;
  border-radius:20px;
  margin:12px 0 16px;
  overflow:hidden;
}

.bar i{
  display:block;
  height:100%;
  width:0;
  background:#17181c;
}

.macros{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.macro{
  background:#f3f4f7;
  border-radius:14px;
  padding:11px;
}

.macro b{
  display:block;
  font-size:18px;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  border-radius:15px;
  padding:14px;
  font-weight:600;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.primary{
  background:#17181c;
  color:white;
}

.secondary{
  background:white;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:13px;
  background:white;
}

.row{
  display:flex;
  gap:9px;
}

.food{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.food:last-child{
  border:0;
}

.food b{
  display:block;
}

.empty{
  text-align:center;
  color:#888;
  padding:15px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  align-items:flex-end;
  z-index:5;
}

.sheet{
  background:white;
  width:100%;
  border-radius:24px 24px 0 0;
  padding:18px 16px 28px;
}

.sheet h2{
  margin:0 0 14px;
}

.status{
  min-height:22px;
  color:#666;
  margin:12px 0;
}

.result{
  display:none;
  background:#f3f4f7;
  border-radius:15px;
  padding:14px;
}

.result b{
  font-size:18px;
}
</style>
</head>

<body>

<main>

<h1>Мой КБЖУ</h1>

<div class="date" id="date"></div>

<section class="card">

<div>
<span class="kcal" id="kcal">0</span>
<span class="muted">/ 2000 ккал</span>
</div>

<div class="bar">
<i id="bar"></i>
</div>

<div class="macros">

<div class="macro">
<b id="protein">0 г</b>
<span class="muted">Белки</span>
</div>

<div class="macro">
<b id="fat">0 г</b>
<span class="muted">Жиры</span>
</div>

<div class="macro">
<b id="carbs">0 г</b>
<span class="muted">Углеводы</span>
</div>

</div>

</section>


<div class="actions">

<button class="primary" id="photoBtn">
📷 Через фото
</button>

<button class="secondary" id="voiceBtn">
🎤 Голос
</button>

</div>


<section class="card">

<h2>Сегодня</h2>

<div id="foods">
<div class="empty">
Пока ничего не добавлено
</div>
</div>

</section>


<section class="card">

<h2>Быстрый ввод</h2>

<div class="row">

<input
id="manualName"
placeholder="Продукт"
>

<input
id="manualGrams"
type="number"
inputmode="decimal"
placeholder="г"
>

</div>

<button
class="primary"
style="width:100%;margin-top:10px"
id="manualBtn"
>
Добавить
</button>

</section>


<section class="card">

<h2>Мои продукты</h2>

<div id="products">

<div class="empty">
Сохранённых продуктов пока нет
</div>

</div>

</section>

</main>


<div class="modal" id="modal">

<div class="sheet">

<h2>📷 Фото этикетки</h2>

<input
id="photo"
type="file"
accept="image/*"
capture="environment"
>

<input
id="grams"
type="number"
inputmode="decimal"
placeholder="Сколько граммов?"
style="margin-top:10px"
>

<button
class="primary"
style="width:100%;margin-top:10px"
id="analyze"
>
Распознать КБЖУ
</button>

<div
class="status"
id="status"
></div>

<div
class="result"
id="result"
></div>

<button
class="secondary"
style="width:100%;margin-top:10px"
id="closeBtn"
>
Закрыть
</button>

</div>

</div>


<script>

const WORKER =
"https://my-kbju-api.n8mws69t88.workers.dev";

const KEY =
new Date().toISOString().slice(0,10);


const photoBtn =
document.getElementById("photoBtn");

const voiceBtn =
document.getElementById("voiceBtn");

const manualBtn =
document.getElementById("manualBtn");

const manualName =
document.getElementById("manualName");

const manualGrams =
document.getElementById("manualGrams");


const modal =
document.getElementById("modal");

const closeBtn =
document.getElementById("closeBtn");

const photo =
document.getElementById("photo");

const grams =
document.getElementById("grams");

const analyze =
document.getElementById("analyze");

const status =
document.getElementById("status");

const result =
document.getElementById("result");


const kcal =
document.getElementById("kcal");

const protein =
document.getElementById("protein");

const fat =
document.getElementById("fat");

const carbs =
document.getElementById("carbs");

const bar =
document.getElementById("bar");

const foods =
document.getElementById("foods");

const products =
document.getElementById("products");

const date =
document.getElementById("date");


function loadData(){

  try{

    const raw =
      localStorage.getItem("my_kbju");

    const d =
      raw
      ? JSON.parse(raw)
      : {
          days:{},
          products:{}
        };


    if(
      !d.days ||
      typeof d.days !== "object"
    ){
      d.days = {};
    }


    if(
      !d.products ||
      typeof d.products !== "object"
    ){
      d.products = {};
    }


    if(
      Array.isArray(d.products)
    ){

      const old =
        d.products;

      d.products = {};

      old.forEach(p=>{

        if(
          p &&
          p.name
        ){
          d.products[p.name] = p;
        }

      });

    }


    if(
      !Array.isArray(d.days[KEY])
    ){
      d.days[KEY] = [];
    }


    return d;

  }catch(e){

    return {
      days:{
        [KEY]:[]
      },
      products:{}
    };

  }

}


let data =
loadData();


function save(){

  localStorage.setItem(
    "my_kbju",
    JSON.stringify(data)
  );

}


function esc(x){

  return String(
    x ?? ""
  ).replace(
    /[&<>"']/g,
    c=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[c])
  );

}


function num(x){

  return (
    typeof x === "number" &&
    Number.isFinite(x)
  )
  ? x
  : 0;

}


function portion(
  value,
  g
){

  if(value == null){
    return null;
  }

  return +(
    num(value) *
    g /
    100
  ).toFixed(1);

}


function totals(){

  return data.days[KEY].reduce(

    (a,x)=>({

      kcal:
        a.kcal +
        num(x.kcal),

      protein:
        a.protein +
        num(x.protein),

      fat:
        a.fat +
        num(x.fat),

      carbs:
        a.carbs +
        num(x.carbs)

    }),

    {
      kcal:0,
      protein:0,
      fat:0,
      carbs:0
    }

  );

}


function render(){

  const t =
    totals();


  kcal.textContent =
    Math.round(t.kcal);

  protein.textContent =
    t.protein.toFixed(1) +
    " г";

  fat.textContent =
    t.fat.toFixed(1) +
    " г";

  carbs.textContent =
    t.carbs.toFixed(1) +
    " г";


  bar.style.width =
    Math.min(
      100,
      t.kcal / 2000 * 100
    ) + "%";


  foods.innerHTML =
    data.days[KEY].length

    ?

    data.days[KEY]
      .map(x=>`

        <div class="food">

          <div>

            <b>
              ${esc(x.name)}
            </b>

            <span class="muted">
              ${x.grams} г ·
              Б ${x.protein ?? "—"} ·
              Ж ${x.fat ?? "—"} ·
              У ${x.carbs ?? "—"}
            </span>

          </div>

          <strong>
            ${x.kcal ?? "—"} ккал
          </strong>

        </div>

      `)
      .join("")

    :

    '<div class="empty">Пока ничего не добавлено</div>';


  const p =
    Object.values(
      data.products
    );


  products.innerHTML =
    p.length

    ?

    p.map(x=>`

      <div class="food">

        <div>

          <b>
            ${esc(x.name)}
          </b>

          <span class="muted">

            ${x.kcal_100g ?? "—"} ккал ·

            Б ${x.protein_100g ?? "—"} ·

            Ж ${x.fat_100g ?? "—"} ·

            У ${x.carbs_100g ?? "—"}

            на 100 г

          </span>

        </div>

      </div>

    `)
    .join("")

    :

    '<div class="empty">Сохранённых продуктов пока нет</div>';

}


function openModal(){

  modal.style.display =
    "flex";

  status.textContent =
    "";

  result.style.display =
    "none";

}


function closeModal(){

  modal.style.display =
    "none";

  status.textContent =
    "";

  result.style.display =
    "none";

  photo.value =
    "";

  grams.value =
    "";

}


function resize(file){

  return new Promise(
    (resolve,reject)=>{

      const r =
        new FileReader();


      r.onload = ()=>{

        const img =
          new Image();


        img.onload = ()=>{

          let w =
            img.width;

          let h =
            img.height;

          const max =
            1400;


          if(
            Math.max(w,h) > max
          ){

            const s =
              max /
              Math.max(w,h);

            w =
              Math.round(
                w*s
              );

            h =
              Math.round(
                h*s
              );

          }


          const c =
            document.createElement(
              "canvas"
            );

          c.width =
            w;

          c.height =
            h;


          const ctx =
            c.getContext(
              "2d"
            );


          ctx.drawImage(
            img,
            0,
            0,
            w,
            h
          );


          resolve(
            c.toDataURL(
              "image/jpeg",
              0.82
            )
          );

        };


        img.onerror =
          ()=>reject(
            new Error(
              "Не удалось обработать фото"
            )
          );


        img.src =
          r.result;

      };


      r.onerror =
        ()=>reject(
          new Error(
            "Не удалось прочитать фото"
          )
        );


      r.readAsDataURL(
        file
      );

    }
  );

}


photoBtn.addEventListener(
  "click",
  openModal
);


closeBtn.addEventListener(
  "click",
  closeModal
);


voiceBtn.addEventListener(
  "click",
  ()=>{

    alert(
      "Голосовой ввод добавим следующим этапом."
    );

  }
);


manualBtn.addEventListener(
  "click",
  ()=>{

    const name =
      manualName.value.trim();

    const g =
      Number(
        manualGrams.value
      );


    if(!name){

      alert(
        "Введите название продукта."
      );

      return;

    }


    if(!g || g <= 0){

      alert(
        "Укажите количество граммов."
      );

      return;

    }


    const found =
      Object.values(
        data.products
      ).find(
        p =>
          String(
            p.name
          ).toLowerCase()
          ===
          name.toLowerCase()
      );


    if(!found){

      alert(
        "Сначала добавьте этот продукт через фото этикетки."
      );

      return;

    }


    data.days[KEY].push({

      name:
        found.name,

      grams:
        g,

      kcal:
        portion(
          found.kcal_100g,
          g
        ),

      protein:
        portion(
          found.protein_100g,
          g
        ),

      fat:
        portion(
          found.fat_100g,
          g
        ),

      carbs:
        portion(
          found.carbs_100g,
          g
        )

    });


    save();

    render();


    manualName.value =
      "";

    manualGrams.value =
      "";

  }
);


analyze.addEventListener(
  "click",
  async ()=>{

    const file =
      photo.files[0];

    const g =
      Number(
        grams.value
      );


    if(!file){

      status.textContent =
        "Сначала сфотографируйте этикетку.";

      return;

    }


    if(!g || g <= 0){

      status.textContent =
        "Укажите количество граммов.";

      return;

    }


    status.textContent =
      "⏳ Анализирую фото...";

    result.style.display =
      "none";

    analyze.disabled =
      true;


    try{

      const image =
        await resize(file);


      const response =
        await fetch(
          WORKER,
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                image:image,
                grams:g
              })
          }
        );


      let answer;


      try{

        answer =
          await response.json();

      }catch(e){

        throw new Error(
          "Сервер вернул некорректный ответ"
        );

      }


      if(
        !response.ok ||
        !answer.ok
      ){

        throw new Error(
          answer.details ||
          answer.error ||
          "Ошибка сервера"
        );

      }


      const p =
        answer.product;

      const q =
        answer.portion;


      result.innerHTML = `

        <b>
          ${esc(p.name)}
        </b>

        <div style="margin-top:8px">

          ${q.kcal ?? "—"} ккал ·

          Б ${q.protein ?? "—"} г ·

          Ж ${q.fat ?? "—"} г ·

          У ${q.carbs ?? "—"} г

        </div>

        <button
          class="primary"
          style="width:100%;margin-top:12px"
          id="addResult"
        >
          Добавить в дневник
        </button>

      `;


      result.style.display =
        "block";


      status.textContent =
        "✅ Готово";


      data.products[p.name] =
        p;

      save();

      render();


      document
        .getElementById(
          "addResult"
        )
        .addEventListener(
          "click",
          ()=>{

            data.days[KEY].push({

              name:
                p.name,

              grams:
                q.grams,

              kcal:
                q.kcal,

              protein:
                q.protein,

              fat:
                q.fat,

              carbs:
                q.carbs

            });


            save();

            render();

            closeModal();

          }
        );


    }catch(e){

      status.textContent =
        "❌ Ошибка: " +
        e.message;

    }finally{

      analyze.disabled =
        false;

    }

  }
);


date.textContent =
  new Date()
    .toLocaleDateString(
      "ru-RU",
      {
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );


render();

</script>

</body>
</html>
