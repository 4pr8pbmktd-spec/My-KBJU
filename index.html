<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6f4">
<title>Мой КБЖУ</title>
<style>
:root{--g:#5b8f5e;--gl:#eaf3e9;--bg:#f4f7f4;--card:#fff;--t:#18201b;--m:#78827b;--line:#dfe6e0;--red:#b95656;--blue:#347ff0}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}button,input,select{font:inherit}button{border:0;-webkit-tap-highlight-color:transparent}
.app{max-width:820px;margin:auto;min-height:100vh;padding-bottom:100px}
header{padding:22px 18px 12px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;gap:12px;align-items:center}.logo{width:58px;height:58px;border-radius:18px;background:#e8f1e6;display:grid;place-items:center;font-size:32px}
h1{font-size:28px;margin:0;font-weight:800}.sub{color:var(--m);margin-top:3px;font-size:15px}
.lang{display:flex;background:#edf1ed;border-radius:20px;padding:4px;gap:3px}.lang button{background:transparent;color:var(--blue);font-weight:700;padding:9px 13px;border-radius:16px}.lang button.active{background:#fff}
.page{display:none;padding:8px 16px}.page.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px;margin-bottom:14px;box-shadow:0 8px 28px #18351a0b}
.bigcard{padding:25px}.muted{color:var(--m)}.today-label{font-size:20px;color:var(--m)}.big{font-size:68px;font-weight:800;line-height:1;margin:14px 0 10px}.progress{height:16px;background:#e7ece8;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:var(--g);width:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{border:2px solid var(--line);border-radius:22px;padding:18px 8px;text-align:center}.metric b{font-size:30px}.metric span{display:block;color:var(--m);margin-top:4px}
h2{font-size:25px;margin:0 0 18px}h3{font-size:20px;margin:0 0 12px}
.planline{margin-top:18px;color:var(--m);font-size:18px}.planline b{color:var(--t)}
.add{font-size:20px;font-weight:800;margin-bottom:14px}.btn{width:100%;padding:18px;border-radius:22px;font-weight:800;font-size:20px;margin-top:10px}.primary{background:var(--g);color:#fff}.soft{background:var(--gl);color:#416d45}.danger{background:#fbeaea;color:var(--red)}
.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);max-width:820px;margin:auto}.nav button{background:transparent;color:#737d76;padding:9px 3px;border-radius:18px;font-weight:700}.nav button.active{background:var(--gl);color:#416d45}.nav .ico{display:block;font-size:27px;margin-bottom:3px}
.field{margin-bottom:16px}.field label{display:block;font-weight:750;font-size:17px;margin-bottom:7px}.field input,.field select{width:100%;padding:16px 18px;border:2px solid var(--line);border-radius:18px;background:#fff;color:var(--t);outline:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.plan-box{background:#f5f7f5;border-radius:22px;padding:20px}.plan-box span{display:block;color:var(--m);font-size:17px}.plan-box b{font-size:27px;display:block;margin-top:6px}
.list-item{display:flex;justify-content:space-between;gap:10px;padding:15px 0;border-bottom:1px solid var(--line)}.list-item:last-child{border-bottom:0}.del{color:var(--red);background:#fbeaea;border-radius:12px;padding:7px 10px}
.overlay{display:none;position:fixed;z-index:50;inset:0;background:#0007;align-items:flex-end}.overlay.open{display:flex}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:24px 18px calc(24px + env(safe-area-inset-bottom));animation:up .18s ease}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.close{width:48px;height:48px;border-radius:50%;background:#edf1ed;color:var(--blue);font-size:31px}.result{background:#f6f8f6;border:1px solid var(--line);border-radius:25px;padding:20px}.foodname{font-size:25px;font-weight:800}.kcal{font-size:58px;font-weight:800;margin:8px 0}.kcal small{font-size:18px;color:var(--m);font-weight:700}.source{color:var(--m);font-size:16px;line-height:1.5;white-space:pre-line}.note{margin-top:15px;padding:13px 15px;border-radius:18px;background:#edf7ec;color:#47764b}.warn{background:#fff3e8;color:#9a5a1d}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.result-grid div{background:#fff;border-radius:18px;padding:15px 5px;text-align:center;font-weight:800;font-size:21px}.result-grid span{display:block;font-size:14px;color:var(--m);font-weight:500;margin-top:4px}
#status{position:fixed;z-index:100;left:50%;bottom:92px;transform:translateX(-50%);background:#202820;color:#fff;padding:12px 18px;border-radius:15px;display:none;max-width:90%;text-align:center}.empty{color:var(--m);text-align:center;padding:15px}
@keyframes up{from{transform:translateY(30px);opacity:.7}to{transform:none;opacity:1}}
@media(max-width:520px){header{padding-top:18px}.grid3{gap:8px}.metric{padding:15px 4px}.metric b{font-size:25px}.big{font-size:60px}.two,.plan-grid{grid-template-columns:1fr}.sheet{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">🛍️</div><div><h1>Мой КБЖУ</h1><div class="sub" data-i18n="subtitle">Питание под твою цель</div></div></div>
  <div class="lang"><button id="ruBtn" type="button">RU</button><button id="uaBtn" type="button">UA</button></div>
</header>

<section id="today" class="page active">
  <div class="card bigcard">
    <div class="today-label" data-i18n="today">Сегодня</div>
    <div class="big" id="dayKcal">0</div>
    <div class="muted" style="font-size:19px;margin-bottom:24px"><span data-i18n="of">из</span> <b id="dayTarget">—</b> ккал</div>
    <div class="progress"><i id="progressBar"></i></div>
  </div>
  <div class="card">
    <div class="grid3">
      <div class="metric"><b id="dayP">0 г</b><span data-i18n="protein">Белок</span></div>
      <div class="metric"><b id="dayF">0 г</b><span data-i18n="fat">Жиры</span></div>
      <div class="metric"><b id="dayC">0 г</b><span data-i18n="carbsShort">Углев.</span></div>
    </div>
    <div class="planline" id="planLine"></div>
  </div>
  <div class="card">
    <div class="add" data-i18n="addProduct">Добавить продукт</div>
    <button id="cameraBtn" class="btn primary" type="button">📷 <span data-i18n="camera">Сфотографировать</span></button>
    <button id="galleryBtn" class="btn soft" type="button">🖼️ <span data-i18n="gallery">Из галереи</span></button>
    <button id="manualBtn" class="btn soft" type="button">✏️ <span data-i18n="manual">Ввести вручную</span></button>
    <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
    <input id="galleryInput" type="file" accept="image/*" hidden>
    <button id="clearDay" class="btn danger" type="button">🗑️ <span data-i18n="clearDay">Очистить день</span></button>
  </div>
  <div class="card">
    <h2 data-i18n="productsToday">Продукты сегодня</h2>
    <div id="diaryList"></div>
  </div>
</section>

<section id="profile" class="page">
  <div class="card">
    <h2 data-i18n="profile">Профиль</h2>
    <div class="two">
      <div class="field"><label data-i18n="gender">Пол</label><select id="gender"><option value="male">Мужчина</option><option value="female">Женщина</option></select></div>
      <div class="field"><label data-i18n="age">Возраст</label><input id="age" type="number" min="12" max="100"></div>
      <div class="field"><label data-i18n="weight">Вес, кг</label><input id="weight" type="number" step=".1"></div>
      <div class="field"><label data-i18n="height">Рост, см</label><input id="height" type="number" step="1"></div>
    </div>
    <div class="field"><label data-i18n="activity">Активность</label><select id="activity">
      <option value="1.2">Минимальная — сидячий образ жизни</option>
      <option value="1.375">Лёгкая — 1–3 тренировки в неделю</option>
      <option value="1.55">Средняя — 3–5 тренировок в неделю</option>
      <option value="1.725">Высокая — 6–7 тренировок в неделю</option>
      <option value="1.9">Очень высокая — тяжёлая физическая работа</option>
    </select></div>
    <div class="field"><label data-i18n="goal">Цель</label><select id="goal">
      <option value="lose">Похудение</option><option value="maintain">Поддержание</option><option value="gain">Набор веса</option>
    </select></div>
    <button id="calcBtn" class="btn primary" type="button" data-i18n="calcPlan">Рассчитать мой план</button>
  </div>
  <div class="card">
    <h2 data-i18n="yourPlan">Твой рассчитанный план</h2>
    <div class="plan-grid">
      <div class="plan-box"><span data-i18n="calories">Калории</span><b id="planKcal">—</b></div>
      <div class="plan-box"><span data-i18n="protein">Белок</span><b id="planP">—</b></div>
      <div class="plan-box"><span data-i18n="fat">Жиры</span><b id="planF">—</b></div>
      <div class="plan-box"><span data-i18n="carbs">Углеводы</span><b id="planC">—</b></div>
    </div>
  </div>
</section>

<section id="weightPage" class="page">
  <div class="card"><h2 data-i18n="weightPage">Вес</h2><div class="field"><label data-i18n="currentWeight">Текущий вес, кг</label><input id="weight2" type="number" step=".1"></div><button id="saveWeight" class="btn primary" type="button" data-i18n="save">Сохранить</button></div>
</section>

<section id="planPage" class="page">
  <div class="card"><h2 data-i18n="planPage">План</h2><div id="planDetails" class="empty"></div></div>
</section>

<nav class="nav">
  <button type="button" data-page="today"><span class="ico">🏠</span><span data-i18n="today">Сегодня</span></button>
  <button type="button" data-page="profile"><span class="ico">👤</span><span data-i18n="profile">Профиль</span></button>
  <button type="button" data-page="weightPage"><span class="ico">⚖️</span><span data-i18n="weightPage">Вес</span></button>
  <button type="button" data-page="planPage"><span class="ico">🎯</span><span data-i18n="planPage">План</span></button>
</nav>
</div>

<div id="resultModal" class="overlay"><div class="sheet">
  <div class="sheet-head"><h2 data-i18n="result">Результат</h2><button class="close" type="button" data-close="resultModal">×</button></div>
  <div class="result">
    <div class="foodname" id="resultName">—</div>
    <div class="kcal"><span id="resultKcal">—</span> <small><span data-i18n="kcal100">ккал / 100 г</span></small></div>
    <div class="result-grid"><div id="resultP">—<span data-i18n="protein">Белки</span></div><div id="resultF">—<span data-i18n="fat">Жиры</span></div><div id="resultC">—<span data-i18n="carbs">Углеводы</span></div></div>
    <div class="source" id="resultSource"></div><div class="note" id="resultNote"></div>
  </div>
  <div class="field" style="margin-top:18px"><label data-i18n="quantity">Количество, г</label><input id="resultQty" type="number" min="1" step="1" value="100"></div>
  <div class="two"><button id="againBtn" class="btn soft" type="button">🔄 <span data-i18n="again">Распознать ещё раз</span></button><button id="addResultBtn" class="btn primary" type="button">＋ <span data-i18n="add">Добавить</span></button></div>
</div></div>

<div id="manualModal" class="overlay"><div class="sheet">
  <div class="sheet-head"><h2 data-i18n="manualProduct">Продукт вручную</h2><button class="close" type="button" data-close="manualModal">×</button></div>
  <div class="field"><label data-i18n="name">Название</label><input id="mName"></div>
  <div class="two"><div class="field"><label data-i18n="kcal100">ккал / 100 г</label><input id="mKcal" type="number" step=".1"></div><div class="field"><label data-i18n="protein"><span data-i18n="protein100">Белок / 100 г</span></label><input id="mP" type="number" step=".1"></div><div class="field"><label data-i18n="fat"><span data-i18n="fat100">Жиры / 100 г</span></label><input id="mF" type="number" step=".1"></div><div class="field"><label data-i18n="carbs"><span data-i18n="carbs100">Углеводы / 100 г</span></label><input id="mC" type="number" step=".1"></div></div>
  <button id="saveManual" class="btn primary" type="button" data-i18n="add">Добавить</button>
</div></div>

<div id="busyModal" class="overlay"><div class="sheet" style="text-align:center"><h2 id="busyTitle" data-i18n="recognizing">Распознавание…</h2><div id="busyText" class="muted" data-i18n="preparing">Подготавливаю фото</div><div class="progress" style="margin-top:20px"><i id="ocrProgress" style="width:8%"></i></div></div></div>
<div id="status"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
'use strict';

const API_URL='https://my-kbju-api.n8mws69t88.workers.dev';
const STORE='my_kbju_clean_v24';
const todayKey=()=>new Date().toISOString().slice(0,10);

const I18N={
 ru:{
  subtitle:'Питание под твою цель',today:'Сегодня',of:'из',protein:'Белок',fat:'Жиры',carbs:'Углеводы',carbsShort:'Углев.',
  addProduct:'Добавить продукт',camera:'Сфотографировать',gallery:'Из галереи',manual:'Ввести вручную',clearDay:'Очистить день',productsToday:'Продукты сегодня',
  profile:'Профиль',gender:'Пол',age:'Возраст',weight:'Вес, кг',height:'Рост, см',activity:'Активность',goal:'Цель',calcPlan:'Рассчитать мой план',yourPlan:'Твой рассчитанный план',
  calories:'Калории',weightPage:'Вес',currentWeight:'Текущий вес, кг',save:'Сохранить',planPage:'План',result:'Результат',quantity:'Количество, г',
  again:'Распознать ещё раз',add:'Добавить',manualProduct:'Продукт вручную',name:'Название',kcal100:'ккал / 100 г',protein100:'Белок / 100 г',fat100:'Жиры / 100 г',carbs100:'Углеводы / 100 г',recognizing:'Распознавание…',noPlan:'Сначала рассчитай профиль',
  sourceLabel:'Источник',label:'Этикетка',estimated:'Оценка по БЖУ',energy:'Энергия',accepted:'Данные с этикетки приняты.',ocrWeak:'Не удалось уверенно прочитать этикетку. Попробуй снять таблицу крупнее и ровнее.',
  analyzing:'Анализ фото…',preparing:'Подготавливаю фото',ocr:'Читаю таблицу пищевой ценности…',checking:'Проверяю числа…',added:'Продукт добавлен',dayCleared:'День очищен',
  kcalOnly:'Найдена только калорийность — БЖУ на этикетке не удалось прочитать.',bad:'Не удалось надёжно распознать продукт.',estimatedNote:'Калории рассчитаны по БЖУ, потому что явная калорийность не найдена.'
 },
 ua:{
  subtitle:'Харчування відповідно до твоєї мети',today:'Сьогодні',of:'з',protein:'Білки',fat:'Жири',carbs:'Вуглеводи',carbsShort:'Вуглев.',
  addProduct:'Додати продукт',camera:'Сфотографувати',gallery:'З галереї',manual:'Ввести вручну',clearDay:'Очистити день',productsToday:'Продукти сьогодні',
  profile:'Профіль',gender:'Стать',age:'Вік',weight:'Вага, кг',height:'Зріст, см',activity:'Активність',goal:'Мета',calcPlan:'Розрахувати мій план',yourPlan:'Твій розрахований план',
  calories:'Калорії',weightPage:'Вага',currentWeight:'Поточна вага, кг',save:'Зберегти',planPage:'План',result:'Результат',quantity:'Кількість, г',
  again:'Розпізнати ще раз',add:'Додати',manualProduct:'Продукт вручну',name:'Назва',kcal100:'ккал / 100 г',protein100:'Білки / 100 г',fat100:'Жири / 100 г',carbs100:'Вуглеводи / 100 г',recognizing:'Розпізнавання…',noPlan:'Спочатку розрахуй профіль',
  sourceLabel:'Джерело',label:'Етикетка',estimated:'Оцінка за БЖВ',energy:'Енергія',accepted:'Дані з етикетки прийняті.',ocrWeak:'Не вдалося впевнено прочитати етикетку. Спробуй сфотографувати таблицю крупніше та рівніше.',
  analyzing:'Аналіз фото…',preparing:'Готую фото',ocr:'Читаю таблицю харчової цінності…',checking:'Перевіряю числа…',added:'Продукт додано',dayCleared:'День очищено',
  kcalOnly:'Знайдено лише калорійність — БЖВ на етикетці не вдалося прочитати.',bad:'Не вдалося надійно розпізнати продукт.',estimatedNote:'Калорії розраховані за БЖВ, тому що явну калорійність не знайдено.'
 }
};

let state={lang:'ru',profile:{gender:'male',age:32,weight:90,height:176,activity:'1.2',goal:'lose'},plan:null,diary:{},lastFile:null,lastResult:null,worker:null,workerLang:''};
try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(s)state={...state,...s,profile:{...state.profile,...(s.profile||{})}}}catch(e){}

const t=k=>(I18N[state.lang]||I18N.ru)[k]||k;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(STORE,JSON.stringify({lang:state.lang,profile:state.profile,plan:state.plan,diary:state.diary}))}
function toast(msg){const el=$('status');el.textContent=msg;el.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>el.style.display='none',2600)}
function openModal(id){$(id).classList.add('open')}
function closeModal(id){$(id).classList.remove('open')}
function setBusy(on,title=t('analyzing'),text=t('preparing')){if(on){$('busyTitle').textContent=title;$('busyText').textContent=text;$('ocrProgress').style.width='8%';openModal('busyModal')}else closeModal('busyModal')}
function busy(text,pct){$('busyText').textContent=text;$('ocrProgress').style.width=pct+'%'}

function applyLang(){
 document.documentElement.lang=state.lang;
 document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
 $('ruBtn').classList.toggle('active',state.lang==='ru');$('uaBtn').classList.toggle('active',state.lang==='ua');
 $('gender').options[0].textContent=state.lang==='ru'?'Мужчина':'Чоловік';$('gender').options[1].textContent=state.lang==='ru'?'Женщина':'Жінка';
 const acts=state.lang==='ru'
 ?['Минимальная — сидячий образ жизни','Лёгкая — 1–3 тренировки в неделю','Средняя — 3–5 тренировок в неделю','Высокая — 6–7 тренировок в неделю','Очень высокая — тяжёлая физическая работа']
 :['Мінімальна — сидячий спосіб життя','Легка — 1–3 тренування на тиждень','Середня — 3–5 тренувань на тиждень','Висока — 6–7 тренувань на тиждень','Дуже висока — важка фізична робота'];
 [...$('activity').options].forEach((o,i)=>o.textContent=acts[i]);
 [...$('goal').options].forEach((o,i)=>o.textContent=state.lang==='ru'?['Похудение','Поддержание','Набор веса'][i]:['Схуднення','Підтримання','Набір ваги'][i]);
 render();
}
function switchPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id))}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>switchPage(b.dataset.page)));
$('ruBtn').addEventListener('click',()=>{state.lang='ru';save();applyLang()});
$('uaBtn').addEventListener('click',()=>{state.lang='ua';save();applyLang()});

function calcPlan(){
 const p=state.profile,w=Number(p.weight),h=Number(p.height),a=Number(p.age);
 if(!(w>0&&h>0&&a>0)){toast(state.lang==='ru'?'Заполни вес, рост и возраст':'Заповни вагу, зріст і вік');return}
 let bmr=p.gender==='male'?10*w+6.25*h-5*a+5:10*w+6.25*h-5*a-161;
 let kcal=bmr*Number(p.activity);
 if(p.goal==='lose')kcal-=Math.min(500,kcal*.2); else if(p.goal==='gain')kcal+=250;
 kcal=Math.max(1200,Math.round(kcal));
 let protein=Math.round(w*1.6),fat=Math.round(w*.8),carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));
 state.plan={kcal,protein,fat,carbs};save();render();toast(state.lang==='ru'?'План рассчитан':'План розраховано');
}
function syncProfileFields(){
 const p=state.profile;$('gender').value=p.gender;$('age').value=p.age;$('weight').value=p.weight;$('height').value=p.height;$('activity').value=p.activity;$('goal').value=p.goal;$('weight2').value=p.weight;
}
['gender','age','weight','height','activity','goal'].forEach(id=>$(id).addEventListener('change',()=>{
 state.profile[id]=$(id).value;

function addDiary(x){if(!state.diary[todayKey()])state.diary[todayKey()]=[];state.diary[todayKey()].push(x);save();render();toast(t('added'))}

function normalizeText(s){
 return String(s||'').replace(/\r/g,'\n').replace(/[|]/g,' ').replace(/[‐-–—]/g,'-').replace(/[，]/g,',').replace(/\s+/g,' ').trim();
}
function num(s){return Number(String(s).replace(/\s/g,'').replace(',','.'))}
function validKcal(x){return Number.isFinite(x)&&x>=0&&x<=1000}
function validMacro(x){return Number.isFinite(x)&&x>=0&&x<=100}
function parseNutrition(text){
 const raw=String(text||'');
 const lines=raw.split(/\n+/).map(x=>normalizeText(x)).filter(Boolean);
 const flat=normalizeText(raw).replace(/\s+/g,' ');
 let kcal=null,kj=null;
 const pair=/(\d{2,5}(?:[.,]\d+)?)\s*(?:kJ|kj|кДж|кдж)\s*(?:\/|\\|;|,|\s)+\s*(\d{2,5}(?:[.,]\d+)?)\s*(?:kcal|kkal|ккал)/i.exec(flat);
 if(pair){kj=num(pair[1]);kcal=num(pair[2])}
 if(kcal===null){
   const m=/(?:kcal|kkal|ккал)\s*[:=]?\s*(\d{2,5}(?:[.,]\d+)?)/i.exec(flat);
   if(m&&validKcal(num(m[1])))kcal=num(m[1]);
 }
 if(kj===null){
   const m=/(\d{2,5}(?:[.,]\d+)?)\s*(?:kJ|kj|кДж|кдж)/i.exec(flat);
   if(m)kj=num(m[1]);
 }
 if(kcal===null && kj!==null && kj>0 && kj<=4200)kcal=Math.round(kj/4.184);
 if(kcal!==null&&!validKcal(kcal))kcal=null;

 const macroDefs=[
  {key:'f',re:/\b(?:fett|fat|жир\w*|жири)\b/i,exclude:/(gesätt|gesatt|saturated|насыщ|насич)/i},
  {key:'c',re:/\b(?:kohlenhydrate\w*|carbohydrate\w*|углевод\w*|вуглевод\w*)\b/i,exclude:/(zucker|sugar|сахар|цукор)/i},
  {key:'p',re:/\b(?:eiweiß|eiweiss|protein\w*|бел[оа]к\w*|біл[оа]к\w*)\b/i,exclude:null}
 ];
 const out={f:null,c:null,p:null};
 for(const line of lines){
   for(const d of macroDefs){
     if(!d.re.test(line)||d.exclude&&d.exclude.test(line))continue;
     const pos=line.search(d.re);const tail=line.slice(pos);
     const m=tail.match(/(?:[:=]?\s*)(\d{1,3}(?:[.,]\d+)?)\s*g\b/i);
     if(m){const v=num(m[1]);if(validMacro(v)&&out[d.key]===null)out[d.key]=v}
   }
 }
 for(const d of macroDefs){
   if(out[d.key]!==null)continue;
   const m=new RegExp(d.re.source+'[^\\n]{0,35}?(\\d{1,3}(?:[.,]\\d+)?)\\s*g\\b','i').exec(raw);
   if(m){const v=num(m[1]);if(validMacro(v))out[d.key]=v}
 }
 let estimated=false;
 if(kcal===null && [out.p,out.f,out.c].every(v=>validMacro(v))){
   kcal=Math.round(out.p*4+out.f*9+out.c*4);estimated=true;
 }
 return {name:findName(lines),kcal,kj,p:out.p,f:out.f,c:out.c,estimated,raw:raw.slice(0,12000)};
}
function findName(lines){
 const bad=/(brennwert|nährwert|nahrwert|nutrition|fett|fat|kohlenhydrate|carbohydrate|eiweiß|eiweiss|protein|energie|energy|kcal|kj|zucker|sugar|salz|salt|ballast|portion|pro 100|je 100|100 g|davon|saturated|gesätt|gesatt)/i;
 for(const l of lines){if(l.length<3||l.length>60||bad.test(l)||/^\d[\d\s.,%/:-]*$/.test(l))continue;return l.replace(/^[^A-Za-zА-Яа-яÄÖÜäöüßІЇЄієї0-9]+/,'').trim()}
 return 'Распознанный продукт';
}
async function getWorker(langs){
 if(!state.worker)state.worker=await Tesseract.createWorker(langs);
 else if(state.workerLang!==langs.join('+'))await state.worker.reinitialize(langs);
 state.workerLang=langs.join('+');
 await state.worker.setParameters({tessedit_pageseg_mode:'11',preserve_interword_spaces:'1'});
 return state.worker;
}
function loadImage(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=rej;img.src=URL.createObjectURL(file)})}
function makeVariants(img){
 const max=1800,scale=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
 const baseW=Math.round((img.naturalWidth||img.width)*scale),baseH=Math.round((img.naturalHeight||img.height)*scale),arr=[];
 [0,90,180,270].forEach(deg=>{
   const rad=deg*Math.PI/180,sw=deg%180?baseH:baseW,sh=deg%180?baseW:baseH;
   const c=document.createElement('canvas');c.width=sw;c.height=sh;const x=c.getContext('2d',{willReadFrequently:true});
   x.fillStyle='#fff';x.fillRect(0,0,sw,sh);x.save();x.translate(sw/2,sh/2);x.rotate(rad);x.drawImage(img,-baseW/2,-baseH/2,baseW,baseH);x.restore();
   const d=x.getImageData(0,0,sw,sh),a=d.data;
   for(let i=0;i<a.length;i+=4){const y=.299*a[i]+.587*a[i+1]+.114*a[i+2];let v=(y-128)*1.45+128;v=Math.max(0,Math.min(255,v));a[i]=a[i+1]=a[i+2]=v}
   x.putImageData(d,0,0);arr.push(c.toDataURL('image/jpeg',.88));
 });return arr;
}
function scoreOCR(text,parsed){
 let s=0,z=String(text||'').toLowerCase();
 if(/kcal|kkal|ккал/.test(z))s+=5;if(/kj|кдж/.test(z))s+=3;
 if(/fett|fat|жир/.test(z))s+=3;if(/kohlenhydrate|carbohydrate|углевод/.test(z))s+=3;if(/eiweiß|eiweiss|protein|бел[оа]к|біл/.test(z))s+=3;
 if(validKcal(parsed.kcal))s+=6;if(validMacro(parsed.p))s+=3;if(validMacro(parsed.f))s+=3;if(validMacro(parsed.c))s+=3;
 return s;
}

function parseOCRResult(result){
  const text=result?.data?.text||'';
  let parsed=parseNutrition(text);
  const words=(result?.data?.words||[]).filter(w=>String(w.text||'').trim());
  if(!words.length)return parsed;
  const sorted=words.slice().sort((a,b)=>((a.bbox?.y0||0)+(a.bbox?.y1||0))/2-((b.bbox?.y0||0)+(b.bbox?.y1||0))/2);
  const lines=[];
  for(const w of sorted){
    const y=((w.bbox?.y0||0)+(w.bbox?.y1||0))/2;
    let line=lines[lines.length-1];
    if(!line || Math.abs(y-line.y)>Math.max(12,(w.bbox?.y1-w.bbox?.y0||20)*.75)){
      line={y,words:[]};lines.push(line);
    }
    line.words.push(w);
  }
  const texts=lines.map(l=>l.words.sort((a,b)=>(a.bbox?.x0||0)-(b.bbox?.x0||0)).map(w=>w.text).join(' '));
  const byLine=texts.map((line,i)=>({line,i}));
  const getAfter=(line,re)=>{
    const m=re.exec(line); if(!m)return null;
    const tail=line.slice(m.index+m[0].length);
    const n=tail.match(/(\d{1,3}(?:[.,]\d+)?)(?:\s*g\b)?/i);
    return n?num(n[1]):null;
  };
  const defs=[
    {key:'f',re:/\b(?:fett|fat|жир\w*|жири)\b/i,ex:/gesätt|gesatt|saturated|насыщ|насич/i},
    {key:'c',re:/\b(?:kohlenhydrate\w*|carbohydrate\w*|углевод\w*|вуглевод\w*)\b/i,ex:/zucker|sugar|сахар|цукор/i},
    {key:'p',re:/\b(?:eiweiß|eiweiss|protein\w*|бел[оа]к\w*|біл[оа]к\w*)\b/i,ex:null}
  ];
  for(const d of defs){
    if(validMacro(parsed[d.key]))continue;
    for(let i=0;i<byLine.length;i++){
      const q=byLine[i].line;
      if(!d.re.test(q)||d.ex&&d.ex.test(q))continue;
      let v=getAfter(q,d.re);
      if(v===null && byLine[i+1])v=getAfter(byLine[i+1].line,/^/);
      if(validMacro(v)){parsed[d.key]=v;break}
    }
  }
  if(parsed.kcal===null||parsed.kj===null){
    const energy=texts.join(' ');
    const pair=/(\d{2,5}(?:[.,]\d+)?)\s*(?:kJ|kj|кДж|кдж)\s*[\/]?\s*(\d{2,5}(?:[.,]\d+)?)\s*(?:kcal|kkal|ккал)/i.exec(energy);
    if(pair){parsed.kj=num(pair[1]);parsed.kcal=num(pair[2]);parsed.estimated=false;}
  }
  return parsed;
}

async function ocrFile(file){
 const img=await loadImage(file),variants=makeVariants(img),worker=await getWorker(['deu','eng']);
 let best={score:-1,text:'',parsed:null};
 for(let i=0;i<2;i++){busy(`${t('ocr')} ${i+1}/2`,25+i*20);const r=await worker.recognize(variants[i]);const p=parseOCRResult(r),sc=scoreOCR(r.data.text,p);if(sc>best.score)best={score:sc,text:r.data.text,parsed:p}}
 if(best.score<13)for(let i=2;i<4;i++){busy(`${t('ocr')} ${i+1}/4`,60+i*7);const r=await worker.recognize(variants[i]);const p=parseOCRResult(r),sc=scoreOCR(r.data.text,p);if(sc>best.score)best={score:sc,text:r.data.text,parsed:p}}
 if(best.score<13){
   const w2=await getWorker(['rus','ukr']);
   for(let i=0;i<2;i++){busy(state.lang==='ru'?'Пробую русский/украинский OCR…':'Пробую український/російський OCR…',78+i*8);const r=await w2.recognize(variants[i]);const p=parseOCRResult(r),sc=scoreOCR(r.data.text,p);if(sc>best.score)best={score:sc,text:r.data.text,parsed:p}}
 }
 return best;
}
async function apiCandidate(text){
 try{
  const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),9000);
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,language:'ru,uk,de,en',task:'nutrition'}),signal:ctrl.signal});clearTimeout(tm);
  if(!r.ok)return null;const j=await r.json(),d=j.result||j.data||j;
  const k=Number(d.kcal??d.calories??d.energy_kcal),p=Number(d.protein??d.proteins),f=Number(d.fat??d.fats),c=Number(d.carbs??d.carbohydrates),kj=Number(d.kj??d.kJ??d.energy_kj);
  return {name:String(d.name||d.product_name||d.productName||'').trim(),kcal:validKcal(k)?k:null,p:validMacro(p)?p:null,f:validMacro(f)?f:null,c:validMacro(c)?c:null,kj:Number.isFinite(kj)&&kj>0?kj:null};
 }catch(e){return null}
}
function mergeNutrition(local,api){
 const r={...local};
 if((!r.name||r.name==='Распознанный продукт')&&api?.name)r.name=api.name;
 if(!validKcal(r.kcal)&&api?.kcal!=null)r.kcal=api.kcal;
 if(!validMacro(r.p)&&api?.p!=null)r.p=api.p;
 if(!validMacro(r.f)&&api?.f!=null)r.f=api.f;
 if(!validMacro(r.c)&&api?.c!=null)r.c=api.c;
 if(!r.kj&&api?.kj)r.kj=api.kj;
 return r;
}
async function processImage(file){
 state.lastFile=file;setBusy(true,t('analyzing'),t('preparing'));
 try{
   const best=await ocrFile(file);busy(t('checking'),92);
   let parsed=best.parsed||parseNutrition(best.text);
   if(!(validKcal(parsed.kcal)&&validMacro(parsed.p)&&validMacro(parsed.f)&&validMacro(parsed.c))&&best.text.trim().length>20){
     parsed=mergeNutrition(parsed,await apiCandidate(best.text));
   }
   setBusy(false);
   if(!parsed.kcal&&!parsed.p&&!parsed.f&&!parsed.c){toast(t('bad'));return}
   state.lastResult=parsed;showResult(parsed);
 }catch(e){console.error(e);setBusy(false);toast(t('bad'))}
}
function showResult(r){
 $('resultName').textContent=r.name||'Распознанный продукт';$('resultKcal').textContent=r.kcal!=null?Math.round(r.kcal):'—';
 $('resultP').firstChild.textContent=r.p!=null?fmt(r.p)+' г':'—';$('resultF').firstChild.textContent=r.f!=null?fmt(r.f)+' г':'—';$('resultC').firstChild.textContent=r.c!=null?fmt(r.c)+' г':'—';
 $('resultSource').textContent=`${t('sourceLabel')}: ${r.estimated?t('estimated'):t('label')}${r.kcal!=null?' · kcal':''}${r.kj!=null?'\n'+t('energy')+': '+fmt(r.kj)+' kJ':''}`;
 $('resultNote').textContent=r.estimated?t('estimatedNote'):r.kcal!=null?t('accepted'):t('kcalOnly');$('resultNote').className='note'+(r.estimated?' warn':'');
 $('resultQty').value=100;openModal('resultModal');
}
function fmt(x){return Number(x).toLocaleString(state.lang==='ru'?'ru-RU':'uk-UA',{maximumFractionDigits:1})}
$('againBtn').addEventListener('click',()=>{closeModal('resultModal');if(state.lastFile)processImage(state.lastFile)});
$('addResultBtn').addEventListener('click',()=>{const r=state.lastResult;if(!r)return;const qty=Math.max(1,Number($('resultQty').value)||100);addDiary({name:r.name||'Продукт',kcal:Number(r.kcal)||0,p:Number(r.p)||0,f:Number(r.f)||0,c:Number(r.c)||0,qty});closeModal('resultModal')});

syncProfileFields();applyLang();render();
</script>
