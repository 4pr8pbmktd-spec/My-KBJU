<style>

body{

<script>

const KEY=new Date().toISOString().slice(0,10);

const photoBtn=document.getElementById("photoBtn");
const voiceBtn=document.getElementById("voiceBtn");
const manualBtn=document.getElementById("manualBtn");

const manualName=document.getElementById("manualName");
const manualGrams=document.getElementById("manualGrams");

const modal=document.getElementById("modal");
const closeBtn=document.getElementById("closeBtn");

const photo=document.getElementById("photo");
const grams=document.getElementById("grams");

const analyze=document.getElementById("analyze");
const status=document.getElementById("status");
const result=document.getElementById("result");
const ocrbox=document.getElementById("ocrbox");

const rName=document.getElementById("rName");
const rKcal=document.getElementById("rKcal");
const rProtein=document.getElementById("rProtein");
const rFat=document.getElementById("rFat");
const rCarbs=document.getElementById("rCarbs");

const saveResult=document.getElementById("saveResult");
const addResult=document.getElementById("addResult");

const kcal=document.getElementById("kcal");
const protein=document.getElementById("protein");
const fat=document.getElementById("fat");
const carbs=document.getElementById("carbs");
const bar=document.getElementById("bar");

const foods=document.getElementById("foods");
const products=document.getElementById("products");
const date=document.getElementById("date");


function loadData(){

  try{

    const raw=localStorage.getItem("my_kbju");

    let d=raw
      ? JSON.parse(raw)
      : {days:{},products:{}};

    if(!d.days || typeof d.days!=="object"){
      d.days={};
    }

    if(!d.products || typeof d.products!=="object"){
      d.products={};
    }

    if(Array.isArray(d.products)){

      const old=d.products;

      d.products={};

      old.forEach(function(p){

        if(p && p.name){
          d.products[p.name]=p;
        }

      });

    }

    if(!Array.isArray(d.days[KEY])){
      d.days[KEY]=[];
    }

    return d;

  }catch(e){

    return {
      days:{[KEY]:[]},
      products:{}
    };

  }

}


let data=loadData();


function save(){

  localStorage.setItem(
    "my_kbju",
    JSON.stringify(data)
  );

}


function esc(value){

  return String(value ?? "").replace(
    /[&<>"']/g,
    function(c){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[c];

    }
  );

}


function number(value){

  const n=Number(value);

  return Number.isFinite(n) ? n : 0;

}


function calc(value,g){

  if(value===null || value===""){
    return null;
  }

  return Number(
    (number(value)*g/100).toFixed(1)
  );

}


function getTotals(){

  return data.days[KEY].reduce(

    function(total,item){

      total.kcal+=number(item.kcal);
      total.protein+=number(item.protein);
      total.fat+=number(item.fat);
      total.carbs+=number(item.carbs);

      return total;

    },

    {
      kcal:0,
      protein:0,
      fat:0,
      carbs:0
    }

  );

}


function render(){

  const total=getTotals();

  kcal.textContent=Math.round(total.kcal);

  protein.textContent=
    total.protein.toFixed(1)+" г";

  fat.textContent=
    total.fat.toFixed(1)+" г";

  carbs.textContent=
    total.carbs.toFixed(1)+" г";

  bar.style.width=
    Math.min(100,total.kcal/2000*100)+"%";


  if(data.days[KEY].length===0){

    foods.innerHTML=
      '<div class="empty">Пока ничего не добавлено</div>';

  }else{

    foods.innerHTML=
      data.days[KEY].map(function(item){

        return `
        <div class="food">
          <div>
            <b>${esc(item.name)}</b>
            <span class="muted">
              ${item.grams} г ·
              Б ${item.protein ?? "—"} ·
              Ж ${item.fat ?? "—"} ·
              У ${item.carbs ?? "—"}
            </span>
          </div>

          <strong>
            ${item.kcal ?? "—"} ккал
          </strong>
        </div>
        `;

      }).join("");

  }


  const saved=Object.values(data.products);


  if(saved.length===0){

    products.innerHTML=
      '<div class="empty">Сохранённых продуктов пока нет</div>';

  }else{

    products.innerHTML=
      saved.map(function(item){

        return `
        <div class="food">

          <div>

            <b>${esc(item.name)}</b>

            <span class="muted">
              ${item.kcal_100g ?? "—"} ккал ·
              Б ${item.protein_100g ?? "—"} ·
              Ж ${item.fat_100g ?? "—"} ·
              У ${item.carbs_100g ?? "—"}
              на 100 г
            </span>

          </div>

        </div>
        `;

      }).join("");

  }

}


function openModal(){

  modal.style.display="flex";

  status.textContent="";

  result.style.display="none";

  ocrbox.textContent="";

}


function closeModal(){

  modal.style.display="none";

  status.textContent="";

  result.style.display="none";

  ocrbox.textContent="";

  photo.value="";
  grams.value="";

}


photoBtn.addEventListener(
  "click",
  openModal
);


closeBtn.addEventListener(
  "click",
  closeModal
);


/* =========================
   ГОЛОС
========================= */

voiceBtn.addEventListener(
  "click",
  function(){

    const SpeechRecognition=
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if(!SpeechRecognition){

      alert(
        "Голосовой ввод пока не поддерживается этим браузером."
      );

      return;

    }


    const recognition=
      new SpeechRecognition();

    recognition.lang="ru-RU";

    recognition.interimResults=false;

    recognition.maxAlternatives=1;


    recognition.onstart=function(){

      voiceBtn.textContent="🎤 Слушаю...";

    };


    recognition.onresult=function(event){

      const text=
        event.results[0][0].transcript;


      const match=
        text.match(
          /(.+?)\s+(\d+(?:[.,]\d+)?)\s*(?:г|грамм)/i
        );


      if(match){

        manualName.value=
          match[1].trim();

        manualGrams.value=
          match[2].replace(",", ".");

      }else{

        manualName.value=text;

      }

    };


    recognition.onerror=function(){

      alert("Не удалось распознать голос.");

    };


    recognition.onend=function(){

      voiceBtn.textContent="🎤 Голос";

    };


    recognition.start();

  }
);


/* =========================
   БЫСТРЫЙ ВВОД
========================= */

manualBtn.addEventListener(
  "click",
  function(){

    const name=
      manualName.value.trim();

    const g=
      Number(manualGrams.value);


    if(!name){

      alert("Введите название продукта.");

      return;

    }


    if(!g || g<=0){

      alert("Укажите количество граммов.");

      return;

    }


    const saved=
      Object.values(data.products).find(
        function(item){

          return String(item.name).toLowerCase()
            ===name.toLowerCase();

        }
      );


    if(!saved){

      alert(
        "Сначала сохраните этот продукт через фото."
      );

      return;

    }


    data.days[KEY].push({

      name:saved.name,

      grams:g,

      kcal:calc(saved.kcal_100g,g),

      protein:calc(saved.protein_100g,g),

      fat:calc(saved.fat_100g,g),

      carbs:calc(saved.carbs_100g,g)

    });


    save();

    render();

    manualName.value="";
    manualGrams.value="";

  }
);


/* =========================
   ЧИСЛА
========================= */

function cleanNumber(value){

  if(value===null || value===undefined){
    return null;
  }

  let s=String(value)
    .replace(/[Oo]/g,"0")
    .replace(/[Il]/g,"1")
    .replace(/,/g,".")
    .trim();


  const match=
    s.match(/\d+(?:\.\d+)?/);

  if(!match){
    return null;
  }

  const n=Number(match[0]);

  return Number.isFinite(n) ? n : null;

}


/* =========================
   ПОИСК ЧИСЕЛ
========================= */

function numbersFromText(text){

  const matches=
    String(text)
      .replace(/,/g,".")
      .match(/\d+(?:\.\d+)?/g);

  if(!matches){
    return [];
  }

  return matches
    .map(Number)
    .filter(function(n){
      return Number.isFinite(n);
    });

}


/* =========================
   ПОИСК ЧИСЛА РЯДОМ С СЛОВОМ
========================= */

function numberNearKeyword(lines,index,keywords){

  const current=lines[index] || "";

  const lower=current.toLowerCase();


  for(const keyword of keywords){

    const pos=lower.indexOf(keyword);

    if(pos!==-1){

      const after=current.slice(
        pos+keyword.length
      );

      const nums=numbersFromText(after);

      if(nums.length){

        return nums[0];

      }

    }

  }


  for(let step=1;step<=2;step++){

    const line=lines[index+step];

    if(!line){
      continue;
    }

    const nums=numbersFromText(line);

    if(nums.length){

      return nums[0];

    }

  }


  return null;

}


/* =========================
   ЭНЕРГИЯ
========================= */

function findKcal(lines){

  const kcalWords=[
    "kcal",
    "ккал"
  ];


  for(let i=0;i<lines.length;i++){

    const lower=lines[i].toLowerCase();


    if(
      lower.includes("kcal") ||
      lower.includes("ккал")
    ){

      const after=
        lines[i]
          .slice(
            Math.max(
              0,
              Math.max(
                lower.indexOf("kcal"),
                lower.indexOf("ккал")
              )
            )
          );


      const nums=
        numbersFromText(after);


      if(nums.length){

        return nums[0];

      }


      for(let j=i-1;j>=Math.max(0,i-2);j--){

        const nums2=
          numbersFromText(lines[j]);

        if(nums2.length){

          return nums2[nums2.length-1];

        }

      }

    }

  }


  /* Иногда OCR пишет только Energie и число */

  for(let i=0;i<lines.length;i++){

    const lower=lines[i].toLowerCase();


    if(
      lower.includes("energie") ||
      lower.includes("energy")
    ){

      const nums=
        numbersFromText(lines[i]);

      for(const n of nums){

        if(n>20 && n<1000){

          return n;

        }

      }


      const next=
        numbersFromText(lines[i+1] || "");

      for(const n of next){

        if(n>20 && n<1000){

          return n;

        }

      }

    }

  }


  return null;

}


/* =========================
   МАКРОСЫ
========================= */

function findMacro(lines,keywords){

  for(let i=0;i<lines.length;i++){

    const lower=lines[i].toLowerCase();


    let found=false;

    for(const word of keywords){

      if(lower.includes(word)){

        found=true;
        break;

      }

    }


    if(!found){
      continue;
    }


    const value=
      numberNearKeyword(
        lines,
        i,
        keywords
      );


    if(
      value!==null &&
      value>=0 &&
      value<=100
    ){

      return value;

    }

  }


  return null;

}


/* =========================
   НАЗВАНИЕ
========================= */

function findProductName(lines){

  const forbidden=[

    "energie",
    "energy",
    "kcal",
    "kj",
    "protein",
    "eiweiß",
    "eiweiss",
    "fett",
    "fat",
    "kohlenhydrate",
    "carbohydrate",
    "carbs",
    "zucker",
    "sugar",
    "davon",
    "gesättigte",
    "saturates",
    "salt",
    "salz",
    "sodium",
    "белк",
    "жир",
    "углевод",
    "калор"

  ];


  for(const original of lines){

    const line=
      original.trim();


    if(line.length<3 || line.length>70){
      continue;
    }


    const lower=
      line.toLowerCase();


    let bad=false;


    for(const word of forbidden){

      if(lower.includes(word)){

        bad=true;
        break;

      }

    }


    if(bad){
      continue;
    }


    if(
      /^\d+$/.test(line) ||
      /^[|Il1_\- ]+$/.test(line)
    ){

      continue;

    }


    const letters=
      line.match(/[A-Za-zА-Яа-яÄÖÜäöüß]/g);


    if(letters && letters.length>=3){

      return line;

    }

  }


  return "Мой продукт";

}


/* =========================
   АНАЛИЗ ТЕКСТА OCR
========================= */

function analyzeOCRText(text){

  const normalized=
    String(text)
      .replace(/\r/g,"")
      .replace(/[ \t]+/g," ")
      .trim();


  const lines=
    normalized
      .split(/\n+/)
      .map(function(line){

        return line.trim();

      })
      .filter(Boolean);


  const nutrition={

    kcal:findKcal(lines),

    protein:findMacro(
      lines,
      [
        "protein",
        "eiweiß",
        "eiweiss",
        "белк"
      ]
    ),

    fat:findMacro(
      lines,
      [
        "fett",
        "fat",
        "жир"
      ]
    ),

    carbs:findMacro(
      lines,
      [
        "kohlenhydrate",
        "carbohydrate",
        "carbohydrates",
        "carbs",
        "углевод"
      ]
    )

  };


  return {

    name:findProductName(lines),

    nutrition:nutrition,

    lines:lines

  };

}


/* =========================
   УЛУЧШЕНИЕ ФОТО
========================= */

function preprocessImage(file){

  return new Promise(
    function(resolve,reject){

      const reader=
        new FileReader();


      reader.onload=function(){

        const img=
          new Image();


        img.onload=function(){

          let width=img.width;
          let height=img.height;


          const max=1800;


          if(
            Math.max(width,height)>max
          ){

            const scale=
              max/
              Math.max(width,height);

            width=
              Math.round(width*scale);

            height=
              Math.round(height*scale);

          }


          const canvas=
            document.createElement("canvas");

          canvas.width=width;
          canvas.height=height;


          const ctx=
            canvas.getContext("2d");


          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          /* Улучшение контраста */

          const imageData=
            ctx.getImageData(
              0,
              0,
              width,
              height
            );


          const data=imageData.data;


          for(
            let i=0;
            i<data.length;
            i+=4
          ){

            const r=data[i];
            const g=data[i+1];
            const b=data[i+2];


            const gray=
              0.299*r+
              0.587*g+
              0.114*b;


            const contrast=
              ((gray-128)*1.25)+128;


            data[i]=Math.max(
              0,
              Math.min(255,contrast)
            );

            data[i+1]=Math.max(
              0,
              Math.min(255,contrast)
            );

            data[i+2]=Math.max(
              0,
              Math.min(255,contrast)
            );

          }


          ctx.putImageData(
            imageData,
            0,
            0
          );


          resolve(
            canvas.toDataURL(
              "image/jpeg",
              0.9
            )
          );

        };


        img.onerror=function(){

          reject(
            new Error(
              "Не удалось обработать фотографию."
            )
          );

        };


        img.src=reader.result;

      };


      reader.onerror=function(){

        reject(
          new Error(
            "Не удалось прочитать фотографию."
          )
        );

      };


      reader.readAsDataURL(file);

    }
  );

}


/* =========================
   OCR
========================= */

analyze.addEventListener(
  "click",
  async function(){

    const file=
      photo.files[0];


    const g=
      Number(grams.value);


    if(!file){

      status.textContent=
        "Сначала выберите фотографию.";

      return;

    }


    if(!g || g<=0){

      status.textContent=
        "Укажите количество граммов.";

      return;

    }


    analyze.disabled=true;

    result.style.display="none";


    try{

      status.textContent=
        "⏳ Подготавливаю фотографию...";


      const image=
        await preprocessImage(file);


      status.textContent=
        "⏳ Загружаю OCR-модуль...";


      const worker=
        await Tesseract.createWorker(
          ["rus","eng","deu"],
          1,
          {
            logger:function(info){

              if(
                info.status==="loading language model"
              ){

                status.textContent=
                  "⏳ Загружаю языковой модуль...";

              }


              if(
                info.status==="recognizing text" &&
                typeof info.progress==="number"
              ){

                status.textContent=
                  "⏳ Распознаю: "+
                  Math.round(
                    info.progress*100
                  )+
                  "%";

              }

            }
          }
        );


      const ocr=
        await worker.recognize(image);


      await worker.terminate();


      const text=
        ocr.data.text || "";


      ocrbox.textContent=
        text ||
        "OCR не получил текст.";


      if(!text.trim()){

        throw new Error(
          "Текст на фотографии не удалось распознать."
        );

      }


      status.textContent=
        "⏳ Ищу КБЖУ на этикетке...";


      const parsed=
        analyzeOCRText(text);


      rName.value=
        parsed.name;


      rKcal.value=
        parsed.nutrition.kcal ?? "";


      rProtein.value=
        parsed.nutrition.protein ?? "";


      rFat.value=
        parsed.nutrition.fat ?? "";


      rCarbs.value=
        parsed.nutrition.carbs ?? "";


      result.style.display="block";


      const foundCount=[
        parsed.nutrition.kcal,
        parsed.nutrition.protein,
        parsed.nutrition.fat,
        parsed.nutrition.carbs
      ].filter(function(v){

        return v!==null;

      }).length;


      if(foundCount===4){

        status.textContent=
          "✅ КБЖУ найдено. Проверь значения перед сохранением.";

      }else{

        status.textContent=
          "⚠️ Часть значений не найдена. Проверь этикетку и при необходимости введи их вручную.";

      }

    }catch(error){

      status.textContent=
        "❌ Ошибка: "+
        (error.message || error);

    }finally{

      analyze.disabled=false;

    }

  }
);


/* =========================
   ПОЛУЧИТЬ ПРОДУКТ
========================= */

function getRecognizedProduct(){

  function fieldValue(input){

    if(input.value===""){
      return null;
    }

    const n=
      Number(input.value);

    return Number.isFinite(n)
      ? n
      : null;

  }


  return {

    name:
      rName.value.trim() ||
      "Мой продукт",

    kcal_100g:
      fieldValue(rKcal),

    protein_100g:
      fieldValue(rProtein),

    fat_100g:
      fieldValue(rFat),

    carbs_100g:
      fieldValue(rCarbs)

  };

}


/* =========================
   СОХРАНИТЬ
========================= */

saveResult.addEventListener(
  "click",
  function(){

    const p=
      getRecognizedProduct();


    if(
      p.kcal_100g===null &&
      p.protein_100g===null &&
      p.fat_100g===null &&
      p.carbs_100g===null
    ){

      alert(
        "Не найдено ни одного значения КБЖУ. Введите значения вручную."
      );

      return;

    }


    data.products[p.name]=p;

    save();

    render();


    status.textContent=
      "✅ Продукт сохранён.";

  }
);


/* =========================
   СОХРАНИТЬ + ДНЕВНИК
========================= */

addResult.addEventListener(
  "click",
  function(){

    const p=
      getRecognizedProduct();


    const g=
      Number(grams.value);


    if(!g || g<=0){

      alert(
        "Укажите количество граммов."
      );

      return;

    }


    data.products[p.name]=p;


    data.days[KEY].push({

      name:p.name,

      grams:g,

      kcal:calc(
        p.kcal_100g,
        g
      ),

      protein:calc(
        p.protein_100g,
        g
      ),

      fat:calc(
        p.fat_100g,
        g
      ),

      carbs:calc(
        p.carbs_100g,
        g
      )

    });


    save();

    render();

    closeModal();

  }
);
