<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Мой КБЖУ</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f6fa;
  color:#17181c;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

main{
  max-width:650px;
  margin:auto;
  padding:18px 16px 40px
}

h1{margin:4px 0;font-size:28px}
h2{margin-top:0}

.date{
  color:#777;
  margin-bottom:18px
}

.card{
  background:#fff;
  border-radius:20px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 12px #0001
}

.kcal{
  font-size:32px;
  font-weight:700
}

.muted{
  color:#777;
  font-size:14px
}

.bar{
  height:9px;
  background:#e8e9ee;
  border-radius:20px;
  margin:12px 0 16px;
  overflow:hidden
}

.bar i{
  display:block;
  height:100%;
  width:0;
  background:#17181c
}

.macros{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px
}

.macro{
  background:#f3f4f7;
  border-radius:14px;
  padding:11px
}

.macro b{
  display:block;
  font-size:18px
}

button,input{
  font:inherit
}

button{
  border:0;
  border-radius:15px;
  padding:14px;
  font-weight:600;
  cursor:pointer
}

.primary{
  background:#17181c;
  color:#fff
}

.secondary{
  background:#fff
}

button:disabled{
  opacity:.6
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:13px;
  background:#fff
}

.row{
  display:flex;
  gap:9px
}

.food{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee
}

.food:last-child{
  border-bottom:0
}

.food b{
  display:block
}

.empty{
  text-align:center;
  color:#888;
  padding:15px
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  align-items:flex-end;
  z-index:10
}

.sheet{
  background:#fff;
  width:100%;
  max-height:92vh;
  overflow:auto;
  border-radius:24px 24px 0 0;
  padding:18px 16px 28px
}

.sheet h2{
  margin:0 0 14px
}

.status{
  min-height:22px;
  color:#666;
  margin:12px 0
}

.result{
  display:none;
  background:#f3f4f7;
  border-radius:15px;
  padding:14px
}

.result b{
  font-size:18px
}

.field{
  margin-top:10px
}

.field label{
  display:block;
  font-size:13px;
  color:#777;
  margin-bottom:5px
}

.nutrition{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px
}

.small{
  padding:11px
}
</style>
</head>

<body>

<main>

<h1>Мой КБЖУ</h1>

<div class="date" id="date"></div>

<section class="card">

<div>
<span class="kcal" id="kcal">0</span>
<span class="muted">/ 2000 ккал</span>
</div>

<div class="bar">
<i id="bar"></i>
</div>

<div class="macros">

<div class="macro">
<b id="protein">0 г</b>
<span class="muted">Белки</span>
</div>

<div class="macro">
<b id="fat">0 г</b>
<span class="muted">Жиры</span>
</div>

<div class="macro">
<b id="carbs">0 г</b>
<span class="muted">Углеводы</span>
</div>

</div>
</section>


<div class="actions">

<button class="primary" id="photoBtn">
📷 Через фото
</button>

<button class="secondary" id="voiceBtn">
🎤 Голос
</button>

</div>


<section class="card">

<h2>Сегодня</h2>

<div id="foods">
<div class="empty">
Пока ничего не добавлено
</div>
</div>

</section>


<section class="card">

<h2>Быстрый ввод</h2>

<div class="row">

<input
id="manualName"
placeholder="Продукт"
>

<input
id="manualGrams"
type="number"
inputmode="decimal"
placeholder="г"
>

</div>

<button
class="primary"
id="manualBtn"
style="width:100%;margin-top:10px"
>
Добавить
</button>

</section>


<section class="card">

<h2>Мои продукты</h2>

<div id="products">
<div class="empty">
Сохранённых продуктов пока нет
</div>
</div>

</section>

</main>


<div class="modal" id="modal">

<div class="sheet">

<h2>📷 Фото этикетки</h2>

<input
id="photo"
type="file"
accept="image/*"
capture="environment"
>

<div class="field">

<label>Количество продукта</label>

<input
id="grams"
type="number"
inputmode="decimal"
placeholder="Например, 200 г"
>

</div>


<button
class="primary"
id="analyze"
style="width:100%;margin-top:10px"
>
Распознать КБЖУ
</button>


<div
class="status"
id="status"
></div>


<div
class="result"
id="result"
>

<div class="field">

<label>Название продукта</label>

<input id="rName">

</div>


<div class="nutrition">

<div class="field">

<label>Ккал на 100 г</label>

<input
id="rKcal"
type="number"
step="0.1"
>

</div>


<div class="field">

<label>Белки на 100 г</label>

<input
id="rProtein"
type="number"
step="0.1"
>

</div>


<div class="field">

<label>Жиры на 100 г</label>

<input
id="rFat"
type="number"
step="0.1"
>

</div>


<div class="field">

<label>Углеводы на 100 г</label>

<input
id="rCarbs"
type="number"
step="0.1"
>

</div>

</div>


<button
class="primary"
id="saveResult"
style="width:100%;margin-top:12px"
>
Сохранить продукт
</button>


<button
class="secondary"
id="addResult"
style="width:100%;margin-top:10px"
>
Сохранить и добавить в дневник
</button>

</div>


<button
class="secondary"
id="closeBtn"
style="width:100%;margin-top:10px"
>
Закрыть
</button>

</div>
</div>


<script>

const KEY=new Date().toISOString().slice(0,10);

const photoBtn=document.getElementById("photoBtn");
const voiceBtn=document.getElementById("voiceBtn");
const manualBtn=document.getElementById("manualBtn");

const manualName=document.getElementById("manualName");
const manualGrams=document.getElementById("manualGrams");

const modal=document.getElementById("modal");
const closeBtn=document.getElementById("closeBtn");

const photo=document.getElementById("photo");
const grams=document.getElementById("grams");

const analyze=document.getElementById("analyze");
const status=document.getElementById("status");
const result=document.getElementById("result");

const rName=document.getElementById("rName");
const rKcal=document.getElementById("rKcal");
const rProtein=document.getElementById("rProtein");
const rFat=document.getElementById("rFat");
const rCarbs=document.getElementById("rCarbs");

const saveResult=document.getElementById("saveResult");
const addResult=document.getElementById("addResult");

const kcal=document.getElementById("kcal");
const protein=document.getElementById("protein");
const fat=document.getElementById("fat");
const carbs=document.getElementById("carbs");
const bar=document.getElementById("bar");

const foods=document.getElementById("foods");
const products=document.getElementById("products");
const date=document.getElementById("date");


function loadData(){

  try{

    const raw=localStorage.getItem("my_kbju");

    let d=raw
      ? JSON.parse(raw)
      : {days:{},products:{}};

    if(!d.days || typeof d.days!=="object"){
      d.days={};
    }

    if(!d.products || typeof d.products!=="object"){
      d.products={};
    }

    if(Array.isArray(d.products)){

      const old=d.products;

      d.products={};

      old.forEach(function(p){

        if(p && p.name){
          d.products[p.name]=p;
        }

      });

    }

    if(!Array.isArray(d.days[KEY])){
      d.days[KEY]=[];
    }

    return d;

  }catch(e){

    return {
      days:{[KEY]:[]},
      products:{}
    };

  }

}


let data=loadData();


function save(){

  localStorage.setItem(
    "my_kbju",
    JSON.stringify(data)
  );

}


function esc(value){

  return String(value ?? "").replace(
    /[&<>"']/g,
    function(c){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[c];

    }
  );

}


function number(value){

  const n=Number(value);

  return Number.isFinite(n) ? n : 0;

}


function calc(value,grams){

  if(value==null || value===""){
    return null;
  }

  return Number(
    (number(value)*grams/100).toFixed(1)
  );

}


function getTotals(){

  return data.days[KEY].reduce(

    function(total,item){

      total.kcal+=number(item.kcal);
      total.protein+=number(item.protein);
      total.fat+=number(item.fat);
      total.carbs+=number(item.carbs);

      return total;

    },

    {
      kcal:0,
      protein:0,
      fat:0,
      carbs:0
    }

  );

}


function render(){

  const total=getTotals();

  kcal.textContent=Math.round(total.kcal);

  protein.textContent=
    total.protein.toFixed(1)+" г";

  fat.textContent=
    total.fat.toFixed(1)+" г";

  carbs.textContent=
    total.carbs.toFixed(1)+" г";

  bar.style.width=
    Math.min(100,total.kcal/2000*100)+"%";


  if(data.days[KEY].length===0){

    foods.innerHTML=
      '<div class="empty">Пока ничего не добавлено</div>';

  }else{

    foods.innerHTML=
      data.days[KEY].map(function(item){

        return `
        <div class="food">

          <div>

            <b>${esc(item.name)}</b>

            <span class="muted">
              ${item.grams} г ·
              Б ${item.protein ?? "—"} ·
              Ж ${item.fat ?? "—"} ·
              У ${item.carbs ?? "—"}
            </span>

          </div>

          <strong>
            ${item.kcal ?? "—"} ккал
          </strong>

        </div>
        `;

      }).join("");

  }


  const saved=Object.values(data.products);


  if(saved.length===0){

    products.innerHTML=
      '<div class="empty">Сохранённых продуктов пока нет</div>';

  }else{

    products.innerHTML=
      saved.map(function(item){

        return `
        <div class="food">

          <div>

            <b>${esc(item.name)}</b>

            <span class="muted">
              ${item.kcal_100g ?? "—"} ккал ·
              Б ${item.protein_100g ?? "—"} ·
              Ж ${item.fat_100g ?? "—"} ·
              У ${item.carbs_100g ?? "—"}
              на 100 г
            </span>

          </div>

        </div>
        `;

      }).join("");

  }

}


function openModal(){

  modal.style.display="flex";

  status.textContent="";

  result.style.display="none";

}


function closeModal(){

  modal.style.display="none";

  status.textContent="";

  result.style.display="none";

  photo.value="";
  grams.value="";

}


photoBtn.addEventListener(
  "click",
  openModal
);


closeBtn.addEventListener(
  "click",
  closeModal
);


/* Голосовой ввод */

voiceBtn.addEventListener(
  "click",
  function(){

    const SpeechRecognition=
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if(!SpeechRecognition){

      alert(
        "Голосовой ввод пока не поддерживается этим браузером."
      );

      return;

    }

    const recognition=
      new SpeechRecognition();

    recognition.lang="ru-RU";

    recognition.interimResults=false;

    recognition.maxAlternatives=1;

    recognition.onstart=function(){

      voiceBtn.textContent="🎤 Слушаю...";

    };

    recognition.onresult=function(event){

      const text=
        event.results[0][0].transcript;

      const match=
        text.match(/(.+?)\s+(\d+(?:[.,]\d+)?)\s*(?:г|грамм)/i);

      if(match){

        manualName.value=
          match[1].trim();

        manualGrams.value=
          match[2].replace(",", ".");

      }else{

        manualName.value=text;

      }

    };

    recognition.onerror=function(){

      alert("Не удалось распознать голос.");

    };

    recognition.onend=function(){

      voiceBtn.textContent="🎤 Голос";

    };

    recognition.start();

  }
);


/* Быстрый ввод */

manualBtn.addEventListener(
  "click",
  function(){

    const name=
      manualName.value.trim();

    const g=
      Number(manualGrams.value);

    if(!name){

      alert("Введите название продукта.");

      return;

    }

    if(!g || g<=0){

      alert("Укажите количество граммов.");

      return;

    }


    const saved=
      Object.values(data.products).find(
        function(item){

          return String(item.name).toLowerCase()
            ===name.toLowerCase();

        }
      );


    if(!saved){

      alert(
        "Сначала добавьте этот продукт через фото этикетки."
      );

      return;

    }


    data.days[KEY].push({

      name:saved.name,

      grams:g,

      kcal:calc(saved.kcal_100g,g),

      protein:calc(saved.protein_100g,g),

      fat:calc(saved.fat_100g,g),

      carbs:calc(saved.carbs_100g,g)

    });


    save();

    render();

    manualName.value="";
    manualGrams.value="";

  }
);


/* Поиск числового значения */

function findNumber(text){

  const match=
    text.match(/(\d+(?:[.,]\d+)?)/);

  if(!match){
    return null;
  }

  return Number(
    match[1].replace(",", ".")
  );

}


/* Поиск КБЖУ */

function findNutrition(text){

  const lines=
    text
      .split(/\n+/)
      .map(function(x){
        return x.trim();
      })
      .filter(Boolean);


  let resultData={
    kcal:null,
    protein:null,
    fat:null,
    carbs:null
  };


  for(const line of lines){

    const lower=line.toLowerCase();

    const value=findNumber(line);

    if(value===null){
      continue;
    }


    if(
      resultData.kcal===null &&
      (
        lower.includes("kcal") ||
        lower.includes("ккал")
      )
    ){

      resultData.kcal=value;

    }


    if(
      resultData.protein===null &&
      (
        lower.includes("protein") ||
        lower.includes("eiweiß") ||
        lower.includes("eiweiss") ||
        lower.includes("белк")
      )
    ){

      resultData.protein=value;

    }


    if(
      resultData.fat===null &&
      (
        lower.includes("fat") ||
        lower.includes("fett") ||
        lower.includes("жир")
      )
    ){

      resultData.fat=value;

    }


    if(
      resultData.carbs===null &&
      (
        lower.includes("carbohydrate") ||
        lower.includes("kohlenhydrate") ||
        lower.includes("carbs") ||
        lower.includes("углевод")
      )
    ){

      resultData.carbs=value;

    }

  }


  return resultData;

}


/* Распознавание фото */

analyze.addEventListener(
  "click",
  async function(){

    const file=photo.files[0];

    const g=Number(grams.value);


    if(!file){

      status.textContent=
        "Сначала сфотографируйте этикетку.";

      return;

    }


    if(!g || g<=0){

      status.textContent=
        "Укажите количество граммов.";

      return;

    }


    analyze.disabled=true;

    result.style.display="none";


    try{

      status.textContent=
        "⏳ Распознаю текст на фото...";


      const ocr=
        await Tesseract.recognize(
          file,
          "rus+eng+deu",
          {
            logger:function(info){

              if(
                info.status==="recognizing text" &&
                typeof info.progress==="number"
              ){

                status.textContent=
                  "⏳ Распознаю: "+
                  Math.round(info.progress*100)+
                  "%";

              }

            }
          }
        );


      const text=ocr.data.text;


      if(!text.trim()){

        throw new Error(
          "Текст на фотографии не удалось распознать."
        );

      }


      const nutrition=
        findNutrition(text);


      let productName=
        linesFirstProductName(text);


      rName.value=
        productName || "Мой продукт";

      rKcal.value=
        nutrition.kcal ?? "";

      rProtein.value=
        nutrition.protein ?? "";

      rFat.value=
        nutrition.fat ?? "";

      rCarbs.value=
        nutrition.carbs ?? "";


      result.style.display="block";


      status.textContent=
        "✅ Фото обработано. Проверь значения перед сохранением.";

    }catch(error){

      status.textContent=
        "❌ "+error.message;

    }finally{

      analyze.disabled=false;

    }

  }
);


/* Название продукта */

function linesFirstProductName(text){

  const lines=
    text
      .split(/\n+/)
      .map(function(x){
        return x.trim();
      })
      .filter(Boolean);


  for(const line of lines){

    const lower=line.toLowerCase();


    if(
      line.length>=3 &&
      line.length<=80 &&
      !/\d{2,}/.test(line) &&
      !lower.includes("kcal") &&
      !lower.includes("ккал") &&
      !lower.includes("protein") &&
      !lower.includes("eiweiß") &&
      !lower.includes("fett") &&
      !lower.includes("kohlenhydrate") &&
      !lower.includes("белк") &&
      !lower.includes("жир") &&
      !lower.includes("углевод")
    ){

      return line;

    }

  }


  return "";

}


/* Сохранение распознанного продукта */

function getRecognizedProduct(){

  return {

    name:
      rName.value.trim() || "Мой продукт",

    kcal_100g:
      rKcal.value==="" ? null : Number(rKcal.value),

    protein_100g:
      rProtein.value==="" ? null : Number(rProtein.value),

    fat_100g:
      rFat.value==="" ? null : Number(rFat.value),

    carbs_100g:
      rCarbs.value==="" ? null : Number(rCarbs.value)

  };

}


saveResult.addEventListener(
  "click",
  function(){

    const p=
      getRecognizedProduct();


    data.products[p.name]=p;

    save();

    render();

    status.textContent=
      "✅ Продукт сохранён в «Мои продукты».";

  }
);


addResult.addEventListener(
  "click",
  function(){

    const p=
      getRecognizedProduct();

    const g=
      Number(grams.value);


    data.products[p.name]=p;


    data.days[KEY].push({

      name:p.name,

      grams:g,

      kcal:calc(p.kcal_100g,g),

      protein:calc(p.protein_100g,g),

      fat:calc(p.fat_100g,g),

      carbs:calc(p.carbs_100g,g)

    });


    save();

    render();

    closeModal();

  }
);


date.textContent=
  new Date().toLocaleDateString(
    "ru-RU",
    {
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  );


render();

</script>

</body>
</html>
